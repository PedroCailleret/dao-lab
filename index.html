","act":"Lei nº 15.068/2024, arts. 2º, 4º e 15; Código Civil, art. 44, VII e § 2º","how":"Organização coletiva com características legais, como autogestão, envolvimento pessoal e singularidade de voto.","limit":"É indispensável diferenciar características, enquadramento em política pública e efeitos da forma jurídica utilizada.","pin":"§ 4.2.4, pp. 65–66; nota 77, p. 65","cases":["ees"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D1","D2","D4"]},{"id":"ees12784","title":"Grupo informal na economia solidária","act":"Decreto nº 12.784/2025, art. 6º, IV e §§ 1º–2º, e art. 20, § 2º","how":"Admite cadastro de grupos informais nos termos específicos da política, distinguindo identificação e personalidade.","limit":"Inscrição no Cadsol não torna qualquer DAO pessoa jurídica nem fornece responsabilidade limitada.","pin":"§ 4.5.5, p. 90, 1º par.; nota 112","cases":["ees","comum"],"stages":["qualificar","comparar","situacoes","vias"],"dims":["D2","D3"]},{"id":"lindb11","title":"Conexão da entidade constituída no exterior","act":"LINDB, art. 11 (Decreto-Lei nº 4.657/1942)","how":"Estabelece conexão para organizações destinadas a fins de interesse coletivo segundo lei de constituição.","limit":"Não resolve sozinho a natureza das atividades locais de organização digital sem Estado de constituição identificável.","pin":"§ 4.2.4, p. 66, 2º par.; nota 78","cases":["estrangeira"],"stages":["qualificar","dimensoes","comparar"],"dims":["D1","D2","D3"]},{"id":"cc-foreign","title":"Sociedade estrangeira no Brasil","act":"Código Civil, arts. 1.134–1.138","how":"Disciplina autorização e representação permanente para funcionamento no País conforme situação aplicável.","limit":"A constituição estrangeira não dá autorização irrestrita nem imputa a ela todos os negócios da comunidade.","pin":"§ 4.2.4, p. 66, 2º par.; nota 78","cases":["estrangeira"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D3","D5"]},{"id":"fundos-cc","title":"Fundo como condomínio especial","act":"Código Civil, arts. 1.368-C–1.368-F","how":"Prevê efeitos patrimoniais diferenciados e limitação de responsabilidade em condições legais e regulamentares.","limit":"Não é regime livre para qualquer DAO; a segregação de classes só existe quando os requisitos legais são satisfeitos.","pin":"§ 4.2.4, p. 66, 3º par.; nota 79; Quadro 2, p. 67","cases":["fundo"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D2","D3","D5"]},{"id":"mp2200","title":"Documentos e assinaturas eletrônicas","act":"MP nº 2.200-2/2001, art. 10, §§ 1º–2º","how":"Prova autoria e integridade eletrônica nos termos e condições previstos; admite outros meios de comprovação.","limit":"Assinar com endereço pseudônimo não supre automaticamente identidade civil, poderes, capacidade ou forma.","pin":"§ 4.3.1, p. 68, 1º par.; nota 81","cases":["ltda","ltda-simples","sa","coop","assoc","fund","ees","fundo","spe","estrangeira","hibrida","atip","crise"],"stages":["dimensoes","situacoes","vias"],"dims":["D1","D3"]},{"id":"lei14063","title":"Assinatura avançada e atos perante juntas","act":"Lei nº 14.063/2020, arts. 2º, 4º e 5º, nas hipóteses aplicáveis","how":"Requisitos para assinatura avançada no âmbito pertinente: vínculo ao signatário, controle e detecção de alteração.","limit":"A carteira EOA pseudônima não é equiparada automaticamente a assinatura identificada de atos registráveis.","pin":"§ 4.3.1, p. 68, 1º par.; nota 81","cases":["ltda","ltda-simples","sa","spe","hibrida"],"stages":["dimensoes","situacoes","vias"],"dims":["D1","D3"]},{"id":"drei81","title":"Assinaturas e reunião digital no DREI","act":"Instrução Normativa DREI nº 81/2020, arts. 33, § 1º, 35 e 35-A; Anexo IV","how":"Documentação, assinatura e procedimentos societários digitais, conforme natureza do ato apresentado.","limit":"Não transforma toda transação criptográfica em identificação civil ou deliberação válida.","pin":"§ 4.3.1, pp. 68–69; notas 81–82","cases":["ltda","ltda-simples","sa","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D3","D4"]},{"id":"lei8934","title":"Registro mercantil: publicidade e efeitos","act":"Lei nº 8.934/1994, arts. 1º, 29 e 36","how":"Funções de publicidade, autenticidade, segurança e eficácia, inclusive efeitos temporais dos arquivamentos.","limit":"Transação em blockchain pode fornecer prova, mas não substitui os efeitos de inscrição ou arquivamento previstos em lei.","pin":"§ 4.3.2, p. 69, 1º par.; nota 83","cases":["ltda","sa","hibrida","spe","comum"],"stages":["qualificar","dimensoes","comparar","situacoes","vias"],"dims":["D2","D3"]},{"id":"lei8934e","title":"Documento de interesse da sociedade","act":"Lei nº 8.934/1994, art. 32, II, e","how":"Possível base para requerer arquivamento de documento de governança técnica de limitada empresária já registrada.","limit":"A proposta depende da admissibilidade material e procedimental pela Junta; não institui registro DAO nem novos efeitos patrimoniais.","pin":"§ 4.5.4, p. 87, 4º par.; § 4.6, p. 92","cases":["ltda","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D3","D4"]},{"id":"lgpd","title":"Proteção de dados e publicidade proporcional","act":"Lei nº 13.709/2018 (LGPD), arts. 3º, 6º–7º e 18","how":"Publicidade relevante deve observar finalidade, necessidade, acesso e direitos dos titulares.","limit":"Transparência não justifica exposição irreversível indiscriminada de dados pessoais em cadeia pública.","pin":"§ 4.3.2, p. 71, parágrafo sobre proteção de dados; nota 85","cases":["ltda","ltda-simples","sa","coop","assoc","fund","ees","fundo","spe","estrangeira","hibrida","crise","infra"],"stages":["dimensoes","avaliar","vias"],"dims":["D3"]},{"id":"cc-liability","title":"Responsabilidade por ato ilícito","act":"Código Civil, arts. 186, 187 e 927","how":"Responsabilização por conduta própria, observados os pressupostos legais pertinentes.","limit":"Não confundir acesso técnico ou capacidade de executar com fundamento automático de culpa ou responsabilidade.","pin":"§ 4.4.2, p. 75, 1º par.; nota 91","cases":["infra","atip","comum","scp","ltda","ltda-simples","sa","coop","assoc","fund","ees","fundo","spe","estrangeira","hibrida","crise"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D5"]},{"id":"cc50","title":"Desconsideração e abuso da personalidade","act":"Código Civil, art. 50; CPC, arts. 133–137","how":"Desconsideração exige pressupostos materiais de abuso e procedimento específico.","limit":"Não é ferramenta geral para atribuir dívidas a tokenholders; distinta de responsabilidade por conduta própria.","pin":"§ 4.4.2, pp. 75–76; notas 91 e 93","cases":["ltda","ltda-simples","sa","assoc","fund","spe","estrangeira","hibrida","crise"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D5"]},{"id":"cdc","title":"Relação de consumo e fornecedor despersonalizado","act":"CDC, arts. 2º–3º, 14 e 51, VII","how":"Permite examinar responsabilidade do fornecedor inclusive despersonalizado e os limites de cláusulas de arbitragem em consumo.","limit":"Incidência depende de caracterizar relação de consumo e defeito do serviço; não é universal para DAOs.","pin":"§ 4.4.2, p. 76, parágrafo final; § 4.4.3, pp. 77–78; nota 95, p. 77 e nota 99, p. 78","cases":["crise","infra","atip","hibrida"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D5"]},{"id":"cpc75","title":"Representação processual de ente sem personalidade","act":"CPC, art. 75, VIII–IX e § 2º; art. 103","how":"Admite representação de sociedades/associações irregulares e entes organizados sem personalidade para fins processuais.","limit":"Capacidade/representação processual não cria personalidade ou responsabilidade limitada nem identifica qualquer pseudônimo por si só.","pin":"§ 4.4.3, p. 77, 1º par.; nota 96","cases":["comum","scp","atip","crise","hibrida","infra"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D5"]},{"id":"cpc319","title":"Identificação e diligências iniciais","act":"CPC, art. 319, §§ 1º–3º, e arts. 320–321","how":"Autoriza requerer diligências para obter dados e evita que lacunas formais inviabilizem acesso à Justiça nas hipóteses legais.","limit":"Identificar endereços on-chain não basta: é preciso individualizar vínculo, réus e condições do processo.","pin":"§ 4.4.3, p. 77, 2º par.; nota 97","cases":["crise","comum","atip","hibrida","infra"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D5"]},{"id":"cpcproof","title":"Prova eletrônica e exibição","act":"CPC, arts. 369, 373, 381, 384, 396–404, 411, 439–441 e 464","how":"Instrumentos de prova e exibição para relacionar transações, deliberações, assinaturas e pessoas.","limit":"Logs imutáveis não provam automaticamente autoria civil ou licitude da transferência; respeitar ônus probatório.","pin":"§ 4.4.3, p. 78, 1º par.; nota 98","cases":["crise","comum","atip","ltda","ltda-simples","sa","hibrida","estrangeira"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D3","D5"]},{"id":"cpc-tutela","title":"Tutela específica, urgência e medidas executivas","act":"CPC, arts. 297, 300–301, 497, 499 e 536–537","how":"Pode impor restituição, indenização ou obrigações de fazer/não fazer, dentro dos requisitos de tutela adequada.","limit":"Ordem judicial não garante capacidade técnica de reescrever a blockchain; observar irreversibilidade do provimento antecipado.","pin":"§ 4.4.3, p. 79, 1º–2º par.; nota 101","cases":["crise","comum","atip","hibrida","infra"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D5"]},{"id":"cpc-exec","title":"Execução e constrição da participação","act":"CPC, arts. 139, IV, 789–790, 805, 835, IX, e 861","how":"Conferir medidas executivas, responsabilidade patrimonial e constrição de participações segundo pressupostos legais.","limit":"A posse técnica de chaves, isoladamente, não determina titularidade jurídica ou autoriza indiscriminadamente penhora.","pin":"§ 4.4.3, p. 79, parágrafos sobre execução; nota 102","cases":["crise","comum","scp","ltda","sa","hibrida"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D2","D5"]},{"id":"cpc599","title":"Dissolução parcial e apuração de haveres","act":"CPC, arts. 599–609","how":"Via processual para discutir resolução do vínculo societário e apuração de haveres dentro do seu âmbito legal.","limit":"A venda de token não equivale automaticamente a recesso; há requisitos especiais para S.A. fechada.","pin":"§ 4.2.3, p. 64, 1º par.; nota 73","cases":["ltda","ltda-simples","sa","spe","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D5"]},{"id":"arbitragem","title":"Arbitragem e cláusulas de adesão","act":"Lei nº 9.307/1996, arts. 1º, 3º e 4º, §§ 1º–2º","how":"Validade de convenções de arbitragem depende de capacidade, disponibilidade patrimonial e requisitos de adesão.","limit":"Código ou clique automático não substitui aceite qualificado quando exigível; CDC também impõe limites.","pin":"§ 4.4.3, p. 78, parágrafo sobre arbitragem; nota 99","cases":["atip","scp","ltda","sa","hibrida","crise"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D5"]},{"id":"lei11101","title":"Insolvência e falência","act":"Lei nº 11.101/2005, arts. 1º–2º, 48, 51, V, e 81","how":"Exame de empresarialidade, recuperação, falência e consequências para sócios ilimitadamente responsáveis.","limit":"Não aplicar o regime concursal empresarial indistintamente a qualquer comunidade ou sociedade simples.","pin":"§ 4.2.2, p. 62, 1º par.; § 4.4.3, pp. 79–80; nota 103, p. 80","cases":["comum","scp","ltda","sa","hibrida","ltda-simples","crise"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D5"]},{"id":"cf170","title":"Ordem econômica e função social","act":"Constituição Federal, art. 170, caput e incisos II–VI","how":"Parâmetro interpretativo de interesses, livre iniciativa, propriedade, tutela de terceiros e custos distributivos.","limit":"“Função social da empresa” é construção interpretativa do trabalho, não expressão literal do inciso III.","pin":"§ 4.5.2, p. 83, 4º par.; nota 106","cases":["infra","atip","comum","scp","ltda","ltda-simples","sa","coop","assoc","fund","ees","fundo","spe","estrangeira","hibrida","crise"],"stages":["avaliar","situacoes","vias"],"dims":["D4","D5"]},{"id":"cf-org","title":"Liberdade associativa e legalidade da reforma","act":"Constituição Federal, arts. 5º, II e XVII–XX, e 22, I","how":"Autonomia organizacional e limites da atuação administrativa para instituir regimes jurídicos novos.","limit":"Orientação ou regulamento administrativo não cria pessoa, separação patrimonial ou responsabilidade limitada sem lei.","pin":"§ 4.5.4, p. 86, 3º par.; nota 108; § 4.5.5, p. 89, 1º par.","cases":["infra","atip","comum","scp","ltda","sa","assoc","fund","ees","hibrida"],"stages":["avaliar","situacoes","vias"],"dims":["D2","D3"]},{"id":"cvm40","title":"Criptoativos e valores mobiliários","act":"CVM, Parecer de Orientação nº 40/2022","how":"Obriga avaliar conteúdo econômico dos direitos e incidência de legislação de valores mobiliários em ofertas pertinentes.","limit":"O enquadramento societário não exaure a disciplina regulatória de tokens; incidência é contextual.","pin":"§ 4.5.4, p. 88, 9º par.; nota 109","cases":["fundo","sa","ltda","hibrida","infra","estrangeira"],"stages":["qualificar","situacoes","vias"],"dims":["D3","D5"]},{"id":"bcb520","title":"Prestadores de serviços de ativos virtuais","act":"Resolução BCB nº 520/2025, arts. 1º, 3º–4º e 14–18","how":"Forma societária, administração e governança para prestadoras abrangidas pela resolução.","limit":"Não generalizar exigência a toda DAO: incide sobre a atividade regulada.","pin":"§ 4.5.4, p. 88, 9º par.; nota 109","cases":["infra","ltda","hibrida","estrangeira","crise","sa"],"stages":["qualificar","situacoes","vias"],"dims":["D1","D4","D5"]},{"id":"cpc-litis","title":"Legitimidade e acesso à justiça","act":"CPC, arts. 17–18 e 75, VIII–IX","how":"Exame de legitimidade para postular e representação processual de entes não personificados.","limit":"A dificuldade de citação de participantes pseudônimos é prova/implementação, não ausência geral de tutela.","pin":"§ 4.4.3, p. 77, 1º–2º par.; nota 96","cases":["crise","comum","hibrida","atip"],"stages":["qualificar","situacoes","vias"],"dims":["D1","D5"]},{"id":"cc-admin","title":"Deveres de administradores","act":"Código Civil, arts. 1.011 e 1.016; arts. 1.053 e 1.030","how":"Disciplina diligência, responsabilidade e algumas hipóteses de exclusão na gestão de sociedades.","limit":"Administrar uma multisig tecnicamente não equipara, por si, a cargo societário; dependem funções e pressupostos.","pin":"§ 4.4.1, pp. 73–74; nota 89, p. 74","cases":["ltda","ltda-simples","comum","hibrida","spe"],"stages":["qualificar","dimensoes","avaliar"],"dims":["D4","D5"]},{"id":"sa-digital","title":"Assembleia digital de S.A.","act":"Lei nº 6.404/1976, arts. 121, parágrafo único, e 124, § 2º-A; Resolução CVM nº 81/2022, no âmbito aplicável","how":"Oferece procedimentos para voto a distância e assembleia digital, com regulamentação pertinente.","limit":"O meio digital não dispensa identificação e direitos acionários nem autoriza votantes externos a exercer direitos sem título.","pin":"§ 4.3.1, pp. 68–69, 2º–4º par.; nota 82, p. 69","cases":["sa"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D3","D4"]},{"id":"cc-annul","title":"Impugnação de deliberações e prazos","act":"Código Civil, arts. 48, parágrafo único, e 1.078, §§ 3º–4º; Lei nº 6.404/1976, art. 286","how":"Examina prazo e pressupostos específicos para desconstituição de deliberações e aprovação de contas.","limit":"O prazo de três anos do art. 48 não é prazo geral de qualquer voto; a disciplina específica da Ltda ou S.A. tem objeto próprio.","pin":"§ 4.4.2, p. 75, 3º par.; nota 92","cases":["ltda","ltda-simples","sa","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D3","D4","D5"]},{"id":"cc-exclusion","title":"Exclusão de sócio e procedimento","act":"Código Civil, arts. 1.030, 1.053 e 1.085","how":"Examina hipóteses e procedimento para exclusão, observando regência da limitada e posições jurídicas de sócios.","limit":"Retirada automática de token não equivale a exclusão juridicamente válida de sócio.","pin":"§ 4.4.1, p. 73, 3º par.; nota 88","cases":["ltda","ltda-simples","comum","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D4","D5"]},{"id":"cpc-account","title":"Exibição e prestação de contas judicial","act":"CPC, arts. 17 e 550–553","how":"Instrumentos processuais para exigir contas e tutelar acesso a informações nos pressupostos legais.","limit":"A publicidade técnica do ledger não substitui as contas e obrigações juridicamente exigíveis.","pin":"§ 4.4.1, p. 73, 2º par.; nota 87","cases":["ltda","ltda-simples","comum","sa","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D3","D5"]},{"id":"stj2085","title":"STJ: contas e titularidade comprovada","act":"STJ, REsp nº 2.085.219/SP, Terceira Turma, julgado em 09/06/2026","how":"Examina acesso a contas anteriores à inclusão formal diante de titularidade de quotas comprovada por acordo judicial em limitada.","limit":"Não estende direitos de fiscalização a todo titular de token: vínculo societário demonstrado é indispensável.","pin":"§ 4.4.1, p. 73, nota 87 (inteiro teor do acórdão)","cases":["ltda","ltda-simples","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D3","D4","D5"]},{"id":"stj2207","title":"STJ: aprovação das contas e ação social","act":"STJ, REsp nº 2.207.934/RS, Informativo 873, Terceira Turma, 2025","how":"Síntese institucional do julgamento registra relevância de anular previamente aprovação de contas para a ação social examinada.","limit":"Não é regra universal sobre quaisquer DAOs nem sobre toda ação indenizatória; TCC consultou síntese, não inteiro teor.","pin":"§ 4.4.2, p. 76, 1º par.; nota 93 (síntese institucional)","cases":["sa"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D4","D5"]},{"id":"stj1137","title":"STJ: proporcionalidade de medidas executivas","act":"STJ, Tema Repetitivo nº 1.137, Segunda Seção, julgado em 04/12/2025","how":"Serve de referência à seleção de meios executivos e suas balizas, conforme emprego delimitado no TCC.","limit":"O precedente não trata especificamente de DAOs ou criptoativos; titularidade e possibilidade concreta de cumprimento são questões próprias.","pin":"§ 4.4.3, p. 79, nota 102","cases":["crise","comum","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D5"]},{"id":"drei-comp","title":"Competências administrativas de registro","act":"Lei nº 8.934/1994, art. 4º; CF/1988, arts. 5º, II, e 22, I","how":"Distingue poder de aperfeiçoar procedimentos e impossibilidade administrativa de criar efeitos jurídicos materiais reservados à lei.","limit":"Não se pode instituir nova personalidade, imunidade ou segregação por orientação administrativa do DREI.","pin":"§ 4.5.4, p. 86, 3º par.; nota 108","cases":["ltda","hibrida","sa","spe"],"stages":["avaliar","situacoes","vias"],"dims":["D2","D3"]}]}</script>
<script>
'use strict';const DB=JSON.parse(document.getElementById('dataset').textContent);let selectedCase='ltda',selectedStage='premissas',currentPage='case',openedModal=null,lastFocus=null;
const $=id=>document.getElementById(id);const h=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const esc=h;const refs=DB.references;const CA=Object.fromEntries(DB.cases.map(x=>[x.id,x]));const NO=Object.fromEntries(DB.norms.map(x=>[x.id,x]));const TM=Object.fromEntries(DB.terms.map(x=>[x.k,x]));const steps=DB.sections.map(s=>s[0]);const stname=id=>(DB.sections.find(x=>x[0]===id)||[])[2]||id;const nameShort=id=>({'premissas':'Premissas','unidade':'Unidade','qualificar':'Exegese','dimensoes':'D1–D5','situacoes':'5 situações','comparar':'Comparado','avaliar':'Poder/risco','vias':'3 vias','concluir':'Output'})[id]||id;

// TCC printed pagination starts two PDF sheets after the front matter.
function tccPdfPin(pin) {
 const m=String(pin||'').match(/\bpp?\.\s*(\d{1,3})/i);
 const page=m ? Number(m[1])+2 : 1;
 return `<p class="small" style="margin:12px 0 14px"><a href="tcc.pdf#page=${page}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 13px;border:1px solid #369eaa;border-radius:9px;color:#55d9d6;font-weight:700;text-decoration:none">📄 Abrir TCC no início do trecho citado ↗</a></p>`;
}

function refChip(refKey,text){let v=refs[refKey];return v?`<button class="cite" data-ref="${h(refKey)}" title="Pinpoint: ${h(v)}">${h(text||'ver fundamento')} ↗</button>`:'';}
function caseNorms(c,stage){return DB.norms.filter(n=>n.cases.includes(c.id)&&(!stage||n.stages.includes(stage)||(!n.stages.length))).sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'))}
function laws(ids){return `<div class="norm-badges">${ids.map(n=>`<button class="lawtag" data-norm="${h(n.id)}" title="${h(n.act)} | TCC: ${h(n.pin)}"><span class="dot">§ </span>${h(n.title)}</button>`).join('')}</div>`}
function caseLinks(c){return c.source.map(r=>refChip(r,'§ '+r)).join(' ')}
function abstractPanel(section){let group=TM[section];return `<div class="railbox"><h3>Referencial abstrato · etapa atual ${refChip(group?.items?.[0]?.[2]||'func')}</h3><div class="railscroll">${(group?.items||[]).map(([n,d,r])=>`<div class="theoryitem"><div style="flex:1"><div class="t-name">${h(n)}</div><div class="t-description">${h(d)}</div></div>${refChip(r,'§')}</div>`).join('')}</div></div>`}
function miniAbstract(section){return `<div class="railbox"><h3>Unidade: protocolo / comunidade / organização ${refChip('unit')}</h3><div class="railscroll">${TM.unidade.items.map(([n,d,r])=>`<div class="theoryitem"><div><div class="t-name">${h(n)}</div><div class="t-description">${h(d)}</div></div></div>`).join('')}</div></div>`}
function miniGrade(){return `<div class="railbox"><h3>Grade D1–D5 · sempre disponível ${refChip('grade')}</h3>${TM.dimensoes.items.map(([n,d,r])=>`<div class="theoryitem"><div style="flex:1"><div class="t-name">${h(n)}</div><div class="t-description">${h(d)}</div></div></div>`).join('')}</div>`}
function miniFive(){return `<div class="railbox"><h3>5 situações · § 4.1.2, p. 58 ${refChip('five')}</h3>${TM.situacoes.items.map(([n,d,r])=>`<div class="theoryitem"><div style="flex:1"><div class="t-name">${h(n)}</div><div class="t-description">${h(d)}</div></div></div>`).join('')}</div>`}
function apply(t,s,refKey){return `<article class="applycard"><div class="paneltitle"><h3>${h(t)}</h3>${refChip(refKey||'grade')}</div><p>${h(s)}</p></article>`}
function rows(entries, names, refKey){return entries.map((txt,i)=>apply(names[i]||String(i+1),txt,refKey)).join('')}
function dimensionCards(c){const defs=['D1 — Imputação e representação','D2 — Personalidade e segregação','D3 — Publicidade e oponibilidade','D4 — Governança e controle','D5 — Responsabilidade'];return c.dims.map((t,i)=>{let k='D'+(i+1),matches=caseNorms(c).filter(n=>n.dims.includes(k));let P={
infra:{D1:['cc104','cc981'],D2:['cc-common','cc981'],D3:['lgpd','mp2200'],D4:['cc981'],D5:['cc-liability','cdc']},
atip:{D1:['cc425','cc981'],D2:['cc425','cc988-990'],D3:['cc104','mp2200'],D4:['cc425'],D5:['cc425','cc-liability','cpc75']},
comum:{D1:['cc981','cc987','cpc75'],D2:['cc988-990','cc1026'],D3:['cc987','lei8934'],D4:['cc981','cc-admin'],D5:['cc988-990','cc-liability','cpc75']},
scp:{D1:['cc-scp'],D2:['cc-scp'],D3:['cc-scp'],D4:['cc-scp'],D5:['cc-scp','cpc-exec']},
ltda:{D1:['cc-ltda','cc-delib'],D2:['cc-ltda','cc1055'],D3:['lei8934','cc1057','lei8934e'],D4:['cc-delib','cc-conflict','cc-admin'],D5:['cc1080','cc-liability','cc50']},
'ltda-simples':{D1:['cc966','cc-ltda'],D2:['cc-ltda','cc1055'],D3:['cc-person','drei81'],D4:['cc-delib','cc-conflict'],D5:['cc-admin','cc-liability']},
sa:{D1:['sa-org','sa-digital'],D2:['sa-capital','cc-person'],D3:['sa-capital','sa-fiscal'],D4:['sa-controle','sa-org','sa-digital'],D5:['sa159','sa-controle','cc-liability']},
coop:{D1:['coop5764'],D2:['coop5764'],D3:['coop5764'],D4:['coop5764'],D5:['coop5764','cc-liability']},
assoc:{D1:['assoc53'],D2:['assoc53'],D3:['assoc57'],D4:['assoc53','assoc57'],D5:['assoc57','cc-liability']},
fund:{D1:['fund62'],D2:['fund62'],D3:['fund62'],D4:['fund62'],D5:['fund62','cc-liability']},
ees:{D1:['ees15068','cc981'],D2:['ees15068','ees12784'],D3:['ees12784'],D4:['ees15068'],D5:['cc-common','cc-liability']},
fundo:{D1:['fundos-cc'],D2:['fundos-cc'],D3:['fundos-cc','cvm40'],D4:['fundos-cc'],D5:['fundos-cc','cc-liability']},
spe:{D1:['cc981','cc-ltda'],D2:['cc-ltda','cc1055'],D3:['lei8934','cc-person'],D4:['cc-delib','cc-conflict'],D5:['cc1080','cc-liability']},
estrangeira:{D1:['cc-foreign','lindb11'],D2:['lindb11'],D3:['cc-foreign'],D4:['cc-foreign'],D5:['cc-foreign','cc-liability']},
hibrida:{D1:['cc-ltda','cc981','cpc75'],D2:['cc1055','cc-ltda','cc-common'],D3:['lei8934e','lei8934','lgpd'],D4:['cc-admin','cc-conflict','sa-controle'],D5:['cc-liability','cc988-990','cpc75']},
crise:{D1:['cpc75','cpc319','cdc'],D2:['cc-common','cpc-exec'],D3:['cpcproof','lgpd'],D4:['cc-liability','cpcproof'],D5:['cdc','cpc-tutela','cpc319']}}
let priority=P[c.id]?.[k]||[];let chosen=[...matches].sort((a,b)=>{let ia=priority.indexOf(a.id),ib=priority.indexOf(b.id);return (ia<0?999:ia)-(ib<0?999:ib)}).slice(0,3);return `<article class="applycard"><div class="paneltitle"><h3>${h(defs[i])}</h3>${refChip('grade','critério')}</div><p>${h(t)}</p><div class="miniTitle">Fundamentos legais conectados · ${matches.length} referências</div>${laws(chosen)}${matches.length>3?`<button class="cite" data-contextnorms="${h(c.id)}" style="margin-top:8px">Todos os fundamentos do caso ↗</button>`:''}</article>`}).join('')}

function stageBody(c,k){switch(k){
 case 'premissas':return `<div class="poster"><div class="eyebrow">Ponto de partida · fatos assumidos</div><p class="huge">${h(c.scenario)}</p></div>${apply('Problema jurídico a reconstruir',c.summary,'func')}${apply('Método do trabalho','Não assumir natureza jurídica DAO antes de delimitar a unidade concreta; as conclusões são condicionadas às premissas e verificações probatórias.','met')}`;
 case 'unidade':return `${rows(c.unit,['Protocolo / software','Comunidade / participantes','Organização / coordenação','Entidade jurídica / wrapper'],'unit')}${apply('Unidade a submeter à qualificação',c.regime,'unit')}`;
 case 'qualificar':return `${apply('Regime que surge dos pressupostos',c.regime,c.source[0]||'matrix')}${apply('Subsunção e fundamento',c.qualification,c.source[0]||'matrix')}${apply('Qualificação alternativa e prova necessária',c.alternative,'contract')}`;
 case 'dimensoes':return dimensionCards(c);
 case 'situacoes':return rows(c.situations,['(i) Adequação jurídica','(ii) Dificuldade de implementação','(iii) Controvérsia interpretativa','(iv) Insuficiência normativa','(v) Preferência dos participantes'],'five');
 case 'comparar':return `${apply('Triagem comparativa e três critérios de transplantabilidade',c.comparative,'compar')}${TM.comparar.items.slice(3).map(([n,d,r])=>apply(n,d,r)).join('')}<p class="note">Os critérios são extraídos da comparação. Não são normas brasileiras diretamente transplantadas nem substituem a análise do regime incidente.</p>`;
 case 'avaliar':return `${apply('Teste crítico-estrutural deste caso',c.critical,'theory')}${TM.avaliar.items.slice(3).map(([n,d,r])=>apply(n,d,r)).join('')}`;
 case 'vias':return `${rows(c.paths,['Plano (i) — aplicar direito vigente','Plano (ii) — aperfeiçoar documentalmente','Plano (iii) — alterar a lei quando justificado'],'routes')}${apply('Hipóteses H1–H5: resultado geral do TCC','H1 não confirmada em caráter geral; H2 superioridade não demonstrada; H3 limitada à organização interna; H4 e H5 restringidas pelo teste.','hyp')}`;
 case 'concluir':return `<div class="poster"><div class="eyebrow">Resultado da aplicação · não é decisão judicial</div><p class="huge">${h(c.outcome)}</p></div>${apply('Limites e verificações pendentes',c.limits,'final')}${apply('Rota do raciocínio','Delimitar protocolo, comunidade e organização → investigar os vínculos e a atividade → submeter aos tipos brasileiros → aplicar D1–D5 → classificar as cinco situações → comparar técnicas → confrontar poder, riscos e efeitos → avaliar as três vias → qualificar condicionalmente.','summary')}`;
 default:return '';}}
function stageNav(){return `<div class="stagebar" aria-label="Etapas da análise">${DB.sections.map(([id,num,n])=>`<button class="stagebtn ${id===selectedStage?'active':''}" data-stage="${id}" aria-pressed="${id===selectedStage}"><strong>${num}</strong>${h(nameShort(id))}</button>`).join('')}</div>`}

 let z=item.priority;
 if(item.titleFlat===q)z+=155;
 else if(item.titleFlat.startsWith(q))z+=105;
 else if(item.titleFlat.includes(q))z+=76;
 else z+=Math.round(28*words.filter(w=>item.titleFlat.includes(w)).length/words.length);
 if(item.flat.includes(q))z+=20;
 if(item.kind==='categoria'&&item.titleFlat.includes(q))z+=85;

function previewData(hit){

const legalViewer=document.createElement('div');legalViewer.id='legalViewerV3';legalViewer.className='legal-hover';legalViewer.setAttribute('role','tooltip');document.body.append(legalViewer);

const LEG_SKIP='SCRIPT,STYLE,NOSCRIPT,INPUT,TEXTAREA,OPTION';

function decorateLegislation(root){
