/* EXTENSÃO DE NAVEGAÇÃO — preserva os componentes da versão original */
.nav-switch{display:flex;gap:5px;padding:4px;background:#0b1721;border:1px solid var(--line);border-radius:11px;margin:5px 9px 14px}
.nav-switch button{flex:1;min-width:0;padding:8px 5px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);font-size:12px;font-weight:750}
.nav-switch button[aria-pressed="true"]{background:var(--pane3);border-color:#416a73;color:#e8fffc}
.nav-count{margin-left:auto;padding:1px 7px;border:1px solid #3b4d60;background:#1b293a;border-radius:100px;color:var(--muted);font:10px/1.65 ui-monospace,monospace;white-space:nowrap}
.nav-cat{padding:10px 10px;margin:3px 0;display:flex;align-items:flex-start;gap:8px;text-align:left;background:transparent;width:100%;border:1px solid transparent;border-radius:10px;color:var(--muted);font-size:12.5px;line-height:1.35}
.nav-cat:hover,.nav-cat.active{background:var(--pane3);color:#fff;border-color:#3c5966}
.nav-cat .caret{width:11px;flex:none;color:var(--accent)}
.nav-cat .nav-catname{flex:1;min-width:0}
.nav-cat .nav-catname small{display:block;color:var(--dim);margin-top:2px;font-size:10px}
.nav-catcases{border-left:1px solid #41606d;margin:1px 0 10px 19px;padding-left:8px}
.nav-catcases .navlink{font-size:12px;margin:2px 0;padding:8px;line-height:1.3}
.nav-catcases .relhint{display:block;color:var(--dim);font-size:10px;margin-top:3px}
.nav-explainer{border:1px solid #395166;background:#18293b;border-radius:9px;padding:10px 11px;margin:10px 8px 15px;color:var(--muted);font-size:11px;line-height:1.4}
.nav-explainer strong{color:#d5f3f0}
.global-search{position:relative;flex:1 1 255px;min-width:175px;max-width:500px;z-index:20}
.global-search input{display:block;width:100%;background:#172635;border:1px solid #496073;border-radius:11px;color:var(--txt);padding:11px 38px 11px 38px;font-size:13px;outline:none}
.global-search input::placeholder{color:#a4b5c3}
.global-search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px #70d9c81a}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:#bcd6e0;font-size:16px}
.search-key{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--dim);font:10px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 4px;pointer-events:none}
.search-results{display:none;position:absolute;top:calc(100% + 8px);left:0;width:min(530px,calc(100vw - 30px));max-height:min(65vh,580px);overflow:auto;border:1px solid #476679;border-radius:12px;box-shadow:0 20px 55px #000b;background:#132330;z-index:90;padding:7px}
.global-search.open .search-results{display:block}
.search-result{display:flex;gap:9px;align-items:flex-start;width:100%;background:transparent;text-align:left;color:#e6f0f5;border:1px solid transparent;border-radius:8px;padding:9px 10px;font:inherit;cursor:pointer}
.search-result:hover,.search-result[aria-selected="true"]{background:#234155;border-color:#416a75}
.search-result .srtype{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--accent);background:#15423d;border-radius:5px;padding:3px 5px;margin-top:3px;min-width:60px;text-align:center}
.search-result .srtxt{flex:1;min-width:0}
.search-result .srtxt strong{display:block;font-size:12.5px}
.search-result .srtxt small{display:block;font-size:11px;color:var(--muted);margin-top:2px;line-height:1.35}
.search-empty{padding:12px;color:var(--muted);font-size:12px}
.search-title{padding:8px 10px 5px;color:var(--dim);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.category-result-card{display:block;width:100%;text-align:left;cursor:pointer;padding:14px 16px;background:var(--pane);border:1px solid var(--line);border-radius:11px;color:var(--txt);margin-bottom:8px;font:inherit}
.category-result-card:hover{background:var(--pane3);border-color:#47717b}
.category-result-card .catstatus{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.category-result-card strong{display:block;font-size:15px;margin:4px 0}
.category-result-card p{font-size:12px;color:var(--muted)}
.category-result-card small{display:block;color:var(--orange);font-size:11px;margin-top:7px}
.category-note{border-left:3px solid var(--orange);background:#2d2b27;color:#e6d6bd;padding:13px 16px;border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.5}

@media(max-width:760px){.top{flex-wrap:wrap;gap:8px}.global-search{order:3;max-width:none;flex:1 1 100%}.top-actions{margin-left:auto}.top-left .eyebrow{font-size:10px}.search-results{width:100%;max-height:55vh}}

<script id="dataset" type="application/json">{"references":{"met":"Introdução, pp. 13–14, parágrafos metodológicos; § 4.7, p. 93","func":"§ 2.2, p. 16, 1º parágrafo; § 2.6, p. 25","unit":"§ 4.1.1, pp. 55–57, parágrafos 1–4 e Esquema 1; § 3.5, nota 60, pp. 53–54; nota 63, p. 56","grade":"§ 3.1, pp. 30–33; § 4.1.2, p. 58, 3º parágrafo; Quadro 3, p. 81","five":"§ 4.1.2, p. 58, 3º–4º parágrafos","compar":"§§ 3.1 e 3.5, pp. 30–33 e 48–53; Quadro 1, p. 49; § 3.5, p. 51, 4º parágrafo","theory":"§ 2.1, pp. 15–16; § 4.1.2, pp. 57–58, 1º–2º parágrafos; § 4.7, p. 96, parágrafos 7–8","models":"§ 4.5.3, pp. 84–85, 1º–4º parágrafos; § 4.5.2, pp. 82–84","routes":"§ 4.5.4, pp. 86–88; § 4.5.5, pp. 89–91; Quadro 4, p. 92","hyp":"Quadro 5, § 4.7, p. 94; §§ 4.5.2–4.5.5, pp. 82–91","final":"§ 4.7, pp. 93–97; Conclusão, pp. 98–101","contract":"§ 4.2.1, pp. 59–60, parágrafos 1–3 e notas 65–67","common":"§ 4.2.2, pp. 60–62, parágrafos 1–3; notas 68–69; Quadro 2, p. 67","scp":"§ 4.2.2, p. 62, parágrafo sobre SCP; nota 70; Quadro 2, p. 67","ltda":"§ 4.2.3, pp. 62–64, parágrafos 1–5; notas 71–73; Quadro 2, p. 67","sa":"§ 4.2.3, p. 64, dois últimos parágrafos; nota 74; Quadro 2, p. 67","coop":"§ 4.2.4, pp. 64–65, parágrafos sobre cooperativas; nota 75; Quadro 2, p. 67","assoc":"§ 4.2.4, p. 65, parágrafo sobre associação e fundação; nota 76; Quadro 2, p. 67","fund":"§ 4.2.4, p. 65, parágrafo sobre associação e fundação; nota 76; Quadro 2, p. 67","ees":"§ 4.2.4, pp. 65–66, parágrafo sobre economia solidária; nota 77","foreign":"§ 4.2.4, p. 66, parágrafo sobre entidades estrangeiras; nota 78","fundo":"§ 4.2.4, p. 66, parágrafo sobre fundos; nota 79; Quadro 2, p. 67","spe":"§ 4.2.4, p. 66, último parágrafo","tech":"§§ 4.3.1–4.3.2, pp. 68–71, especialmente p. 70, 2º parágrafo","control":"§ 4.4.1, pp. 72–75, especialmente p. 72, 1º parágrafo; Esquema 2, p. 72","liab":"§ 4.4.2, pp. 75–77; § 4.4.3, pp. 77–79","matrix":"Quadro 2, § 4.2.4, p. 67","summary":"§ 4.5.1, pp. 80–81; Quadro 3, p. 81","interface":"§ 4.5.4, pp. 86–88, especialmente p. 87, parágrafos 4–6; nota 108, p. 86","regulation":"§ 4.5.4, p. 88, parágrafo 9"},"terms":[{"k":"premissas","title":"Premissas metodológicas","items":[["Definição funcional","DAO é coordenação econômica por regras distribuídas e participação, apta a reunir interesses, capitalizar, deliberar e executar; grau de descentralização deve ser comprovado.","func"],["Suspensão categorial heurística","Não começar presumindo que a DAO seja sociedade ou contrato. O enquadramento ocorre após delimitação do objeto.","met"],["Escopo","Recorte societário de função organizacional-empresarial, direito positivo até outubro de 2026; análise dedutivo-funcional, documental, sem prova causal própria.","met"],["Centro de imputação","Ponto a que o ordenamento atribui atos, direitos e deveres; requer identificar sujeitos, poderes e patrimônio.","func"],["Quatro níveis de teoria","Coase/Williamson: diagnóstico econômico; Hansmann/Kraakman: separação patrimonial; Salomão Filho/Chaves: poder e riscos; De Filippi/Mannan: equivalência funcional/regulatória.","theory"]]},{"k":"unidade","title":"Unidade da qualificação","items":[["Protocolo","Código, rede ou aplicação. Pode ser mera infraestrutura, ativo ou instrumento da atividade; não se identifica automaticamente à organização.","unit"],["Comunidade","Usuários, participantes ou titulares de tokens; nem todos compartilham necessariamente um vínculo societário ou estão abrangidos por uma entidade.","unit"],["Organização","Coordenação relativamente estável de finalidade, recursos ou posições, procedimentos decisórios e atuação externa. São indícios funcionais, não requisitos legais cumulativos.","unit"],["Entidade / wrapper","Pessoa jurídica eventualmente vinculada a parte da atividade. Atos, bens e obrigações só se imputam a ela dentro do perímetro efetivamente demonstrado.","unit"],["Arranjo híbrido descritivo","Coexistência de protocolo, comunidade e organização/entidade com perímetros não coincidentes. Não é automaticamente a solução híbrida regulatória H5.","unit"]]},{"k":"qualificar","title":"Qualificação e regimes","items":[["Primeiro o vínculo","Examinar contribuições recíprocas, atividade econômica, resultados (art. 981), empresarialidade (art. 966), atos constitutivos e registro. Token, voto ou título não bastam.","contract"],["Contratos atípicos","Art. 425 admite organização interna; cláusula entre aderentes não impõe imunidade geral a terceiros.","contract"],["Sociedade em comum","Arts. 986–990: ente não personificado, patrimônio especial e responsabilidade solidária/ilimitada dos sócios, com nuances do benefício de ordem e da prova (art. 987).","common"],["SCP","Arts. 991–996: sócio ostensivo atua perante terceiros; especialização patrimonial interna; participante que intervém nas relações externas pode responder solidariamente nos termos legais.","scp"],["Ltda / S.A.","Tipos personificados com disciplina D1–D5; governança digital só opera respeitando competência de órgãos, registro, capital e circulação jurídica.","ltda"],["Outras categorias","Cooperativa; associação; fundação; empreendimento de economia solidária; fundo especial; SPE; entidade estrangeira. Cada qual exige finalidade, vínculo e requisitos próprios.","matrix"]]},{"k":"dimensoes","title":"Tertium comparationis — D1–D5","items":[["D1 · Imputação e representação","A quem os atos são atribuídos? Quem possui poder jurídico para representar/vincular? A chave criptográfica não supre identidade, competência ou consentimento.","grade"],["D2 · Personalidade e segregação patrimonial","Há pessoa jurídica? Qual acervo e titularidade? Que prioridade de credores e limites de responsabilidade existem em lei? Tesouraria codificada não cria esses efeitos.","grade"],["D3 · Publicidade e oponibilidade","Quais informações e direitos são acessíveis e eficazes perante terceiros? Registro on-chain pode informar sem produzir publicidade constitutiva.","grade"],["D4 · Governança e controle","Quem decide e controla realmente? Quais regras de deliberação, conflito, impugnação, saída e fiscalização incidem?","grade"],["D5 · Responsabilidade perante membros e terceiros","Quem é obrigado ou responde por conduta própria? Qual patrimônio pode ser alcançado e quais meios de prova, tutela e execução existem?","grade"]]},{"k":"situacoes","title":"Cinco situações do § 4.1.2","items":[["(i) Adequação jurídica","Regime existente efetivamente atende à função jurídica procurada.","five"],["(ii) Dificuldade de implementação","A solução é juridicamente disponível, mas surgem obstáculos operacionais, probatórios ou procedimentais.","five"],["(iii) Controvérsia interpretativa","Divergência sobre alcance, pressupostos ou compatibilidade das normas existentes.","five"],["(iv) Insuficiência normativa","Função cuja proteção é juridicamente justificada permanece sem atendimento adequado. Exige demonstração, não pressuposição.","five"],["(v) Preferência dos participantes","Os participantes recusam custos, órgãos ou interfaces de disciplina juridicamente apta. Isso não prova lacuna.","five"]]},{"k":"comparar","title":"Comparado e transplantabilidade","items":[["Três operações comparativas","Reconstituir funções em entidade/titulares identificáveis; redistribuir entre sujeitos e mecanismos; examinar substituição funcional por garantias técnicas.","compar"],["Wyoming/Utah","Reconhecimento especial por tipo adaptado ou personalidade por lei, preservando interfaces jurídicas, com diferenças entre DAO LLC, DUNA e Utah.","compar"],["Delaware/Suíça/Colômbia","Absorção por LLC comum; formas civis gerais como Verein/Stiftung; preservação do registro constitutivo da S.A.S. colombiana.","compar"],["Critério T1 · Patrimônio","Segregação patrimonial afirmativa depende de fundamento legal, não de código autossuficiente.","compar"],["Critério T2 · Registro","No sistema brasileiro de civil law, registro tende a ser ponto de contato normativamente relevante, não mero ato dispensável pela blockchain.","compar"],["Critério T3 · Interface","A desintermediação integral encontra limites: poderes, representantes, agentes ou interfaces institucionais identificáveis subsistem em modelos comparados.","compar"]]},{"k":"avaliar","title":"Avaliação crítico-estrutural","items":[["Modelo M1 · Tipo próprio","Comparar a superioridade de tipo especial, inclusive facultativo, sem pressupor ganhos em investimento ou menores custos.","models"],["Modelo M2 · Contrato atípico","Ver o que a autonomia privada disciplina internamente e o que não opõe a terceiros.","models"],["Modelo M3 · Híbrido jurídico H5","Vínculo existente + governança técnica + informação facultativa, sem novos efeitos patrimoniais automáticos.","models"],["Critério A1 · Vínculo e patrimônio","Quem integra a entidade? Quais bens foram efetivamente conferidos?","models"],["Critério A2 · Informação e contestação","Que informação e meios de questionamento estão acessíveis a membros e terceiros?","models"],["Critério A3 · Poder e responsabilidade","Correspondência entre controle efetivo, competências, deveres e riscos.","models"],["Critério A4 · Custos e manutenção","Quanto custa implementar, manter e atualizar a solução em relação aos ganhos protetivos?","models"],["Função social e livre iniciativa","A pergunta é quem é protegido, por qual mecanismo e a que custo. Eficiência não é critério único; função social da empresa é construção interpretativa ligada ao art. 170.","models"]]},{"k":"vias","title":"Três planos de disciplina e H1–H5","items":[["Plano (i) Aplicar","Qualificar corretamente o arranjo e aplicar os sujeitos, bens, deveres, procedimentos, responsabilidade e registros já exigidos.","routes"],["Plano (ii) Aperfeiçoar","Documentar versões de contratos, poderes técnicos, responsáveis, atos e divergências; interface facultativa se juridicamente admissível; alcance informacional.","interface"],["Plano (iii) Legislar","Novos efeitos constitutivos ou patrimoniais requerem lei específica e demonstração de vantagem, custos e tutela de interesses.","routes"],["H1 e H2","H1 inadequação geral não confirmada; H2 superioridade de tipo próprio não demonstrada.","hyp"],["H3","Contrato atípico possível internamente; não assegura eficácia universal de cláusulas limitativas contra credores.","hyp"],["H4","Análise funcional útil; não demonstrada categoria jurídica autônoma universal.","hyp"],["H5","Interface informacional preservada; personalidade/segregação adicionais dependem de fundamento legal.","hyp"]]},{"k":"concluir","title":"Regra do output e limites","items":[["Conclusão condicionada","A classificação resulta das premissas hipotéticas e da prova possível; alternativas e limites devem ser explicitados.","final"],["Não universalizar","DAO não é, necessariamente, sociedade, token não é quota, chave não é cargo, blockchain não é registro societário.","final"],["Suficiência parcial e condicionada","Acomodações variadas já existem; o ponto de tensão é conectar tecnologia aos efeitos perante terceiros.","summary"],["Agenda aberta","Não há demonstração causal nem análise empírica própria que estabeleça superioridade de um tipo novo.","final"]]}],"cases":[{"id":"infra","title":"Protocolo DeFi de uso aberto","group":"Infraestrutura","summary":"Protocolo não equivale automaticamente a sociedade","scenario":"Código imutável de swaps é disponibilizado gratuitamente. Usuários autônomos interagem entre si; não há contribuição comum, programa de partilha de resultados nem comunidade decisória estável demonstrados.","unit":["Aplicação DeFi é a ferramenta técnica principal.","Usuários independentes não constituem, só por usar o serviço, um corpo societário.","Não há organização coletiva estável demonstrada nas premissas.","Nenhuma entidade associada foi indicada."],"regime":"Protocolo-infraestrutura / relações isoladas de usuários e operadores","qualification":"Sem pressupostos suficientes, não se presume sociedade por ações, sociedade em comum ou pessoa coletiva.","alternative":"Se surgirem governança comum estável, exploração econômica organizada e vínculos, o resultado deve ser reavaliado.","dims":["D1 — cada operação deve ser atribuída a seus agentes; não se demonstrou representante coletivo.","D2 — ativos em contratos não identificam por si uma titularidade coletiva ou patrimônio segregado.","D3 — registros públicos de transações não equivalem à inscrição de organização.","D4 — nas premissas não existe órgão coletivo; investigar se há administradores ocultos ou controles de atualização.","D5 — avaliar condutas e obrigações dos operadores e usuários conforme seus negócios, sem dívida coletiva presumida."],"situations":["Não se demonstrou necessidade de tipo societário para o mero protocolo.","Apurar quem controla ou desenvolveu código pode ser trabalhoso.","Poderá haver divergência quanto à existência de organização de fato.","Nenhuma insuficiência normativa material está demonstrada pelo uso do software.","Desejo de não revelar operadores não constitui fundamento para ignorar deveres incidentes."],"comparative":"Padrão comparado: reconstituição jurídica é apropriada quando há organização a reconhecer; não se personaliza um mero ativo por padrão. T1 não oferece segregação por código; T2/T3 dependem de entidade relevante.","critical":"A pergunta crítico-estrutural é se a alegada neutralidade de software encobre poderes de atualização, remuneração ou bloqueio.","paths":["Aplicar contratos e responsabilidade pertinentes a usuários/operadores identificados.","Se existir entidade exploradora, documentar seu vínculo ao software e poderes efetivos.","Sem função juridicamente desatendida demonstrada, não justificar tipo novo."],"outcome":"No caso hipotético apresentado, a classificação sustentável é protocolo como infraestrutura, não uma sociedade universal de todos os usuários.","limits":"Não se conclui inexistência de qualquer agente responsável; faltam fatos de exploração, controle e vínculo.","source":["func","unit","contract","grade","tech"],"extra":{}},{"id":"atip","title":"Coletivo de programadores por contrato","group":"Contrato","summary":"Autonomia privada não cria imunidade organizacional","scenario":"Quatro desenvolvedores celebram acordo de prestação conjunta para clientes específicos, com rateio de honorários e tarefas, sem assumirem explicitamente contribuições para exploração de empreendimento comum nem participações societárias. Um contrato declara que ninguém responde perante terceiros.","unit":["Código serve a registrar tarefas e rateios.","Quatro contratantes com direitos e obrigações definidos.","Colaboração delimitada; não se presume automaticamente a existência de sociedade.","Sem entidade registrada."],"regime":"Contrato atípico ou conjunto de contratos; hipótese societária depende de prova adicional","qualification":"Art. 425 do CC permite disciplinar encargos e remuneração internos; cláusula não vincula automaticamente credores estranhos.","alternative":"Se se comprovarem obrigações recíprocas de contribuição, atividade econômica em comum e partilha de resultados, investigar art. 981 e eventual sociedade em comum.","dims":["D1 — vinculação externa depende de quem contratou e dos poderes conferidos.","D2 — rateio contratual não institui pessoa jurídica nem patrimônio oponivelmente apartado.","D3 — blockchain pode demonstrar entrega, mas cláusulas internas não são publicidade constitutiva.","D4 — pactuar decisões entre os quatro é possível nos limites obrigacionais.","D5 — inadimplemento e condutas seguem o contrato e leis incidentes; a cláusula geral não limita qualquer credor."],"situations":["Há suporte legal para organização contratual interna.","Formalizar assinaturas e explicar a regra on-chain ao contratante é esforço prático.","A fronteira com sociedade é questão interpretativa/fática a apurar.","Não se demonstrou falha normativa apenas porque querem responsabilidade limitada.","Recusa ao registro e preferência pela informalidade não suprimem efeitos legais."],"comparative":"Os modelos contratuais podem cumprir coordenação interna; T1 confirma que limitação patrimonial contra credores não nasce de pactuação privada entre outros.","critical":"Verificar se contratos escondem comando de fato e transferência de riscos a credores sem consentimento.","paths":["Aplicar art. 425 e investigar art. 981 conforme os fatos.","Documentar poderes de assinatura, rateios e prova de atos.","Não há justificativa suficiente para criar personalidade pela declaração contratual."],"outcome":"Contrato atípico é possível sob as premissas, mas a natureza jurídica permanece condicionada à verificação do vínculo societário.","limits":"Não declarar definitivamente inexistência de sociedade; nem eficácia erga omnes da cláusula limitativa.","source":["contract","common","hyp"],"extra":{}},{"id":"comum","title":"DAO que explora negócio sem registro","group":"Não personificadas","summary":"Sociedade em comum: patrimônio especial e responsabilidade","scenario":"Seis pessoas aportam criptoativos, exploram profissionalmente um serviço pago, partilham resultados e gerem contratos por votação. Não registraram atos constitutivos, embora negociem com fornecedores.","unit":["Smart contracts coordenam tesouraria e votações.","Seis participantes que compartilham contribuições, atividade e resultados.","Coordenação empresarial estável e atuação externa suficientemente descritas.","Não há tipo personificado inscrito."],"regime":"Sociedade em comum, condicionada à prova dos elementos dos arts. 981 e 986","qualification":"Os arts. 986–990 oferecem disciplina a sociedade não inscrita: patrimônio especial de titularidade comum e responsabilidade solidária/ilimitada dos sócios, respeitadas nuances legais.","alternative":"A identificação de quem é realmente sócio não deve abranger automaticamente clientes, usuários ou qualquer comprador de token.","dims":["D1 — apurar sócios e quem efetivamente firmou os negócios da sociedade.","D2 — há patrimônio especial do regime não personificado; não confundir com responsabilidade limitada de Ltda.","D3 — atos não inscritos e prova sob o art. 987; transações não substituem identificação civil.","D4 — votações podem revelar gestão, mas comando de chaves e poderes devem ser examinados.","D5 — arts. 988–990; responsabilidade solidária e ilimitada dos sócios com disciplina do benefício de ordem e do contratante."],"situations":["O ordenamento já contém disciplina patrimonial e de responsabilidade.","Vincular pseudônimos a pessoas e provar atos pode ser difícil.","Compatibilidade do art. 1.026 com a remissão do art. 986 exige exame.","Não se demonstrou ausência geral de tutela pelo fato de o grupo não registrar.","Preferir atuar sem órgãos não afasta qualificação e consequências."],"comparative":"T1: patrimônio especial não equivale a limitação geral; T2: falta registro personificante; T3: gestores/contratantes não desaparecem pelo voto on-chain.","critical":"Atribuir toda dívida a qualquer votante pode obscurecer diferença entre sócios, controladores efetivos e simples usuários.","paths":["Aplicar arts. 981 e 986–990, art. 987 para prova e regras processuais pertinentes.","Formalização e documentação seriam aperfeiçoamentos, não imunidades retroativas.","Só propor efeitos novos se insuficiência material e proteção de credores forem demonstradas."],"outcome":"À luz dos fatos, sociedade em comum é uma qualificação plausível e forte; não há personalidade nem limitação geral da responsabilidade dos sócios.","limits":"Patrimônio especial da sociedade em comum não é patrimônio de pessoa jurídica; verificar extensão dos sócios e atos individuais.","source":["common","contract","liab"],"extra":{}},{"id":"scp","title":"DAO de investimentos com sócio ostensivo","group":"Não personificadas","summary":"SCP: interface externa concentrada","scenario":"Uma empresa brasileira celebra contratos com clientes em nome próprio; investidores de uma DAO aportam recursos para o projeto e recebem participação no resultado. O contrato caracteriza a colaboração interna como SCP; participantes fiscalizam por votações digitais, sem negociar diretamente com terceiros.","unit":["Aplicação registra aportes, votos e relatórios.","Participantes são investidores do vínculo interno; usuários não são automaticamente sócios.","Atividade externa conduzida em nome do sócio ostensivo.","O ostensivo é pessoa jurídica pré-existente; a SCP não se personifica com registro."],"regime":"Sociedade em conta de participação, desde que os pressupostos dos arts. 991–996 sejam observados","qualification":"Atos externos do ostensivo permanecem em seu nome e sob sua responsabilidade; especialização patrimonial da conta só produz efeitos entre os sócios.","alternative":"Se participante intervier diretamente nas relações do ostensivo com terceiros, examinar responsabilidade solidária na obrigação em que interveio (art. 993, parágrafo único).","dims":["D1 — sócio ostensivo é centro do vínculo externo; participante atua internamente.","D2 — conta especial produz efeitos internos; não é patrimônio blindado perante credores do ostensivo.","D3 — relatório em blockchain pode informar investidores, mas não alterar natureza da SCP.","D4 — fiscalização e decisões internas possíveis sem confundi-las com contratação externa.","D5 — ostensivo responde perante terceiros; intervenção de participante pode atrair solidariedade legal delimitada."],"situations":["SCP fornece solução organizacional parcial disponível.","É necessário compatibilizar voto técnico com não intervenção externa.","Debater se atos específicos ultrapassam fiscalização e configuram intervenção.","A falta de blindagem desejada não é, por si só, lacuna normativa.","Se o objetivo é autonomia patrimonial externa irrestrita, SCP pode ser escolha inadequada."],"comparative":"T1 distingue conta especial interna de asset partitioning contra credores; T3 destaca a interface humana do ostensivo.","critical":"O arranjo torna visível a centralização da atuação externa, mesmo quando decisões internas pareçam descentralizadas.","paths":["Aplicar arts. 991–996, discriminar intervenção externa e fiscalizações.","Documentar decisões, fluxos, quem negocia e presta contas.","Uma nova blindagem não nasce da SCP nem de contrato com todos os participantes."],"outcome":"Enquadramento SCP viável, mas inadequado para prometer patrimônio autônomo da comunidade e ausência de sócio responsável perante terceiros.","limits":"Não equiparar qualquer voto à intervenção do art. 993, nem patrimônio da conta a pessoa jurídica.","source":["scp","contract","matrix"],"extra":{}},{"id":"ltda","title":"DAO de prestadores com Ltda empresária","group":"Personificadas","summary":"Primeiro exemplo analítico da seção 4.5.3","scenario":"Comunidade estável de prestadores forma uma Ltda empresária inscrita. Há quotas e administradores identificados, bens efetivamente conferidos ao capital. Deliberações digitais auxiliam a gestão; pagamentos são executados em carteiras conectadas ao contrato social.","unit":["Protocolo auxilia votações e execução financeira.","Participantes registrados são sócios; clientes do protocolo não o são por isso.","Operação empresarial estável no objeto social.","Ltda registrada abrange bens e atos dentro do perímetro societário."],"regime":"Sociedade limitada empresária regularmente constituída","qualification":"Os efeitos de D1–D5 derivam dos arts. 985, 1.052–1.076 e atos de registro; carteira comunitária alheia ao capital não seria incorporada por mera votação.","alternative":"Se chaves de pagamento forem controladas por pessoas não autorizadas, a regularidade societária não elimina o problema do controle efetivo.","dims":["D1 — administradores designados representam conforme contrato e lei; voto on-chain não substitui atos competentes.","D2 — personalidade e responsabilidade limitada nos termos legais; só os bens efetivamente conferidos integram o patrimônio social.","D3 — registro e alterações societárias condicionam oponibilidade; token transferido não substitui cessão de quota.","D4 — deliberação digital permitida, preservadas competências, quóruns, fiscalização e deveres.","D5 — sociedade responde por suas obrigações; responsabilidade por administração, avaliação de bens e conduta própria segue a lei."],"situations":["A Ltda oferece disciplina ampla e juridicamente adequada ao vínculo descrito.","Sincronizar versão do smart contract, quotas e registros exige trabalho.","Pode haver disputa quanto a votos, representação e alteração contratual se o código divergir.","Não se demonstra função sem proteção somente porque a gestão usa blockchain.","Desejo de transferir quotas apenas por token não prevalece automaticamente sobre art. 1.057."],"comparative":"T1: separação patrimonial do tipo depende de constituição/registro; T2: registro é elemento de publicidade e personalidade; T3: administradores e instâncias subsistem.","critical":"Perguntar se controladores da multisig exercem influência de fato sem deveres ou supervisão previstos no regime.","paths":["Aplicar integralmente regime da Ltda e registrar atos necessários.","Interface facultativa de governança técnica poderia documentar código, versões e responsáveis, condicionada à admissibilidade da Junta (art. 32, II, e).","Não se justifica tipo novo no exemplo sem demonstração de ganho adicional."],"outcome":"Enquadramento como Ltda empresária é suficiente em termos centrais, condicionado à correspondência real entre governança técnica e jurídica.","limits":"Não presumir que a Ltda represente toda a comunidade nem que a interface facultativa produza segregação nova.","source":["ltda","models","interface","control"],"extra":{"inTCC":"Adaptação do primeiro exemplo analítico de § 4.5.3, p. 85"}},{"id":"ltda-simples","title":"DAO de profissionais intelectuais","group":"Personificadas","summary":"Atividade define se Ltda é simples ou empresária","scenario":"Cinco profissionais prestam serviços intelectuais pessoais por meio de plataforma de propostas e pagamentos coletivos. Constituíram sociedade limitada para repartir receitas, sem organização produtiva que transforme a profissão em elemento de empresa nas premissas.","unit":["Sistema de execução e arrecadação.","Profissionais contribuintes e beneficiários identificados.","Exercício cooperado de serviços intelectuais.","Ltda inscrita no registro competente conforme sua natureza."],"regime":"Sociedade limitada de natureza simples, sob as premissas da exceção do art. 966","qualification":"A escolha de forma limitada não torna a atividade empresária; deve ser verificado o elemento de empresa e o registro competente (art. 1.150).","alternative":"Se a plataforma crescer para uma organização empresarial de produção e circulação independente do exercício intelectual, reavaliar empresarialidade.","dims":["D1 — representação nos poderes do contrato e lei aplicáveis à limitada simples.","D2 — personalidade após inscrição competente e patrimônio social dos bens efetivamente conferidos.","D3 — publicidades e formalidades próprias do registro incidente; plataforma não suprime inscrição.","D4 — decisões por código são auxiliares, vinculadas aos quóruns e órgãos legais.","D5 — disciplina societária e da prestação profissional incide conforme obrigações concretas."],"situations":["O direito oferece a limitada simples quando presentes seus pressupostos.","Apurar concretamente a presença de elemento de empresa é tarefa de qualificação.","A fronteira de atividade intelectual versus empresária pode ser controvertida.","Sem prova de função não atendida, não há lacuna por usar tokens.","Preferir Junta Comercial por facilidade de fluxo não determina a competência registral."],"comparative":"T2: registro depende da natureza da atividade e forma; não se transplantam mecanicamente exigências de LLC estrangeira.","critical":"Ver quem controla a plataforma e se o poder de decisão técnico corresponde aos órgãos da Ltda simples.","paths":["Aplicar art. 966, art. 981, art. 1.150 e disciplina da Ltda.","Documentar regras digitais e poderes segundo registro competente.","Sem necessidade geral de tipo DAO."],"outcome":"Qualificação de limitada simples é hipótese plausível, subordinada à prova da atividade intelectual e ausência do elemento de empresa.","limits":"Não é regra universal que profissões intelectuais sejam sempre sociedades simples; a exceção exige exame concreto.","source":["contract","ltda","matrix"],"extra":{}},{"id":"sa","title":"DAO com ações e votação digital","group":"Personificadas","summary":"S.A. pode incorporar votação digital sem transferir competências legais ao código","scenario":"Uma S.A. fechada de infraestrutura organiza acionistas por plataforma de voto e documenta deliberações com assinaturas digitais. Um contrato inteligente tenta transferir automaticamente a gestão a votação pública de tokenholders que não constam no livro societário.","unit":["Programa agrega votos e emite comandos.","Há acionistas juridicamente titulados e outros usuários de tokens sem equivalência comprovada.","Companhia regularmente estruturada, com órgãos legais.","S.A. registrada com ações regidas pela Lei 6.404/1976."],"regime":"Sociedade anônima; validade da camada técnica condicionada à Lei das S.A.","qualification":"Art. 139 impede outorga das atribuições legais dos órgãos de administração a mecanismo autônomo; escrituração e titularidade das ações seguem o regime legal.","alternative":"Votos de detentores de token só têm relevância societária se expressarem participação/direitos juridicamente válidos e competências observadas.","dims":["D1 — representação pelos administradores competentes; votação pública não transforma tokenholder em órgão.","D2 — pessoa jurídica e patrimônio conforme capital subscrito e integralizado, com regras societárias específicas.","D3 — ações nominativas/escriturais e registros legalmente regulados; token não equivale automaticamente a ação.","D4 — assembleias, administração, fiscalização e conflito de interesses seguem a lei; código auxilia procedimentos.","D5 — companhia, administradores e acionistas respondem nos limites e hipóteses legais pertinentes."],"situations":["S.A. disciplina integralmente D1–D5 em abstrato.","Reconciliar votos on-chain e livros societários tem custo operacional.","Pode surgir disputa sobre validade da deliberação digital.","Nenhuma lacuna permite delegar automaticamente o art. 139 a software.","A preferência por governança sem órgãos não afasta esses órgãos legais."],"comparative":"T1/T2: personalidade e circulação são juridicamente estruturadas; T3: desintermediação de órgãos tem limite positivo expresso.","critical":"Uma DAO pode anunciar governança comunitária, mas concentrar poder efetivo em administradores e titulares de votos jurídicos.","paths":["Manter órgãos/competências, titularidade e escrituração conforme Lei 6.404/1976.","Documentar correspondência entre blockchain, atas e registros válidos.","Reforma de competência de órgãos seria mudança legal de alto ônus justificativo."],"outcome":"Enquadramento S.A. é dado; não é válida a premissa de que a votação pública de tokens substitui automaticamente órgãos e titularidade acionária.","limits":"Não afirmar que toda votação eletrônica é inválida; o ponto é preservação de atribuições e prova dos direitos.","source":["sa","tech","control","matrix"],"extra":{}},{"id":"coop","title":"DAO de trabalhadores cooperados","group":"Base pessoal","summary":"Singularidade de voto versus tokens ponderados por capital","scenario":"Trinta entregadores prestam serviços em benefício comum, aderem pessoalmente à cooperativa e utilizam blockchain para votar. A versão inicial estabelece um voto por cooperado; proposta posterior permitiria comprar tokens para multiplicar votos e negociar participações com terceiros.","unit":["Rede registra decisões, repasses e prestação de contas.","Cooperados com vínculo pessoal demonstrado.","Organização econômica colaborativa de prestação de serviços.","Cooperativa regularmente constituída conforme lei."],"regime":"Cooperativa, se observados seus pressupostos e peculiaridades legais","qualification":"Singularidade de voto e natureza pessoal, com ressalvas legais, podem acomodar governança distribuída; livre compra e transferência de poder exige compatibilização com Lei 5.764/1971.","alternative":"A proposta de token com votos compráveis não se legitima pela tecnologia e pode representar incompatibilidade material com o tipo.","dims":["D1 — responsáveis e representantes previstos na disciplina cooperativa.","D2 — patrimônio e responsabilidade do cooperado dependem da disciplina específica, não necessariamente ilimitada ou sempre limitada.","D3 — atos e inscrição exigidos; negociação de token não substitui transferência válida de direitos pessoais.","D4 — voto pessoal e autogestão são pontos de afinidade; votos por capital podem contrariar o regime.","D5 — deveres perante cooperados e terceiros segundo configuração legal adotada."],"situations":["Cooperativa pode atender governança por pessoa.","Identificar associados e procedimentos de adesão exige processos fora da blockchain.","Aplicação das ressalvas legais sobre votação pode exigir interpretação.","Incompatibilidade do modelo de voto comprado não prova lacuna de lei de DAO.","Preferir livre alienação de poder é preferência incompatível com a forma escolhida."],"comparative":"T1 requer base legal patrimonial; T3 preserva identificação e deveres de membros conforme organização pessoal.","critical":"A compra de votos redistribui poder de maneira incompatível com promessa de autogestão igualitária.","paths":["Manter voto pessoal e regras de admissão e participação legais.","Integrar registros eletrônicos aos procedimentos cooperativos.","Se desejada governança por capital, primeiro avaliar outro tipo, em vez de mudar o regime por software."],"outcome":"Forma cooperativa é potencialmente adequada à DAO de trabalhadores, mas o voto por tokens livremente adquiríveis exige revisão.","limits":"Não generalizar um-voto-por-membro sem ressalvas de lei; nem declarar uniforme a responsabilidade dos cooperados.","source":["coop","matrix","control"],"extra":{}},{"id":"assoc","title":"DAO cultural de finalidade não econômica","group":"Finalidade","summary":"Associação: personalidade sem distribuição de resultados","scenario":"Uma comunidade cultural mantém acervo digital e financia eventos gratuitos por doações. Uma associação registrada administra recursos conforme estatuto, e participantes votam propostas on-chain. O código tenta excluir automaticamente membros sem procedimento de defesa.","unit":["Plataforma auxilia propostas e gestão do acervo.","Associados devem ser delimitados pelo estatuto; doador não é automaticamente associado.","Finalidade cultural não econômica, sem distribuição de resultados entre membros.","Associação registrada com órgãos e estatuto próprios."],"regime":"Associação civil se a finalidade não econômica e requisitos legais estiverem presentes","qualification":"Art. 53 admite associação para fins não econômicos; art. 57 exige justa causa e procedimento com defesa e recurso para exclusão.","alternative":"Se receita passar a ser distribuída como lucro aos membros, a compatibilidade do tipo deve ser reavaliada.","dims":["D1 — representantes indicados no estatuto/registro vinculam a associação.","D2 — a associação tem patrimônio próprio após constituição regular; doações devem ser juridicamente destinadas.","D3 — estatuto e registros exigidos; publicidade on-chain não substitui formas pertinentes.","D4 — deliberação digital é possível quando legal e estatutariamente válida; expulsão por código não afasta defesa/recurso.","D5 — responsabilidades são as do ente e de condutas individuais segundo o regime associativo."],"situations":["A estrutura associativa atende finalidade cultural não econômica.","Conectar identidade de associado e votação digital é questão operacional.","Conflitos sobre estatuto e exclusão podem demandar interpretação.","A exigência legal de defesa não é lacuna ou defeito de automação.","Desejo de expulsão instantânea é preferência insuficiente para suprimir garantia do art. 57."],"comparative":"T1 personalidade e patrimônio vêm dos atos reconhecidos; T2 registro deve ser respeitado; T3 há órgãos e direitos de impugnação.","critical":"Investigar se moderadores de software possuem poder efetivo de excluir sem fiscalização, mesmo quando estatuto promete governança plural.","paths":["Aplicar regime associativo e garantias de exclusão.","Registrar regras e procedimentos técnicos e comunicar divergências a instâncias competentes.","Nenhuma reforma necessária apenas para permitir votação digital condicionada."],"outcome":"Associação é possível para finalidade não econômica; a exclusão automática sem garantias não pode prevalecer sobre o regime legal.","limits":"Associação pode obter receita instrumental, mas não se converte por isso em sociedade de distribuição de lucros.","source":["assoc","matrix","control"],"extra":{}},{"id":"fund","title":"Fundação de preservação de software aberto","group":"Finalidade","summary":"Fundação: patrimônio vinculado à finalidade, não sociedade de tokenholders","scenario":"Instituidores destinam patrimônio a uma finalidade fundacional legalmente admitida de preservação de software e educação. O estatuto é formalizado conforme exigências e a fundação contrata manutenção; detentores de tokens consultivos não têm direitos patrimoniais sobre o acervo.","unit":["Código distribuído é objeto beneficiado e ferramenta de auditoria.","Apoiadores e usuários não equivalem a membros societários da fundação.","Organização de finalidade e administração de bens afetados.","Fundação com patrimônio e fiscalização próprios, se corretamente instituída."],"regime":"Fundação civil nos limites das finalidades do art. 62 e do regime de fiscalização","qualification":"Patrimônio é afetado a finalidade legalmente admitida, sem liberdade para partilha aos titulares de token; art. 66 prevê fiscalização do MP.","alternative":"Se o desenho real for empreendimento lucrativo com distribuição aos participantes, a fundação não corresponde ao propósito.","dims":["D1 — representantes/administradores fundacionais, não tokenholders, praticam atos externos.","D2 — bens afetados à finalidade no patrimônio da fundação conforme instituição legal.","D3 — registro e fiscalização legal; ledger apenas acrescenta prova/publicidade técnica.","D4 — governo subordinado ao fim fundacional e regras próprias; tokens consultivos não são assembleia de sócios.","D5 — responsabilização por atos da fundação e dos administradores conforme deveres pertinentes."],"situations":["O regime dá proteção patrimonial por finalidade.","Conectar votação consultiva e decisão válida demanda procedimentos.","Discussão possível sobre adequação específica da finalidade descrita no ato de instituição.","Não há lacuna só porque tokenholders não podem receber lucros do patrimônio.","Desejo de tratar a fundação como companhia é opção incompatível com a sua finalidade."],"comparative":"T1 proteção patrimonial exige ato/fundamento, T2 o registro/controle institucional permanece, T3 fiscalização é interface jurídica inafastável.","critical":"Não deixar gestores técnicos desviarem bens do fim estatutário; avaliar quem possui acesso efetivo às carteiras.","paths":["Constituir e administrar fundação conforme art. 62 e regime fiscalizatório.","Documentar parâmetros técnicos, transações e responsáveis de modo auditável.","Reforma só se demonstrada função não atendida e tutela preservada."],"outcome":"Fundação pode desempenhar função específica em ecossistema DAO; não é invólucro universal para distribuir ganhos a participantes.","limits":"Finalidades do art. 62 e ato de dotação devem ser verificados; cenário não descreve aprovação institucional real.","source":["fund","matrix","unit"],"extra":{}},{"id":"ees","title":"DAO de economia solidária","group":"Base pessoal","summary":"Empreendimento de economia solidária: afinidade condicionada à autogestão","scenario":"Uma rede de artesãos adota autogestão, participação pessoal e voto singular para comercializar conjuntamente produtos, com regras digitais de prestação de contas. Pretende enquadrar-se na disciplina dos empreendimentos de economia solidária.","unit":["Aplicação registra produção, rateios e deliberações.","Membros identificados com participação na autogestão.","Organização econômica coletiva com finalidade e características solidárias.","Forma jurídica efetiva e requisitos da política pública devem ser analisados separadamente."],"regime":"Possível empreendimento de economia solidária, conforme Lei 15.068/2024 e forma jurídica concretamente adotada","qualification":"A lei descreve características e tratamento dos EES; afinidade com governança distribuída não decorre da blockchain isolada.","alternative":"A denominação EES não substitui o exame do registro, do tipo adotado e de seus efeitos patrimoniais.","dims":["D1 — qualificar órgão e representantes do tipo usado na organização solidária.","D2 — personalidade, bens e responsabilidade dependem da estrutura adotada e regras legais aplicáveis.","D3 — documentação e registros do regime escolhido, além de eventuais requisitos próprios.","D4 — autogestão, participação efetiva e singularidade de voto constituem indícios de adequação.","D5 — regime de responsabilidade não se resolve apenas pelo título EES."],"situations":["Há disciplina relacionada a organização coletiva e autogestão.","Demonstrar governança pessoal efetiva exige documentos.","Pode haver controvérsia sobre requisitos e forma adotada.","A lei da economia solidária não concede automaticamente toda a blindagem desejada.","Querer voto ponderado por aporte pode frustrar as características do modelo."],"comparative":"T1: separar regime da forma jurídica e políticas de economia solidária; T2/T3 mantêm instituições e pessoas exigidas.","critical":"Investigar se participação efetiva é real ou se financiadores controlam decisões apesar da autogestão declarada.","paths":["Escolher e observar forma jurídica compatível com características de EES.","Documentar participação, decisões e responsáveis.","Não criar efeitos patrimoniais por simples uso da denominação."],"outcome":"Enquadramento como empreendimento de economia solidária é uma possibilidade, não uma qualificação automática de personalidade ou regime de responsabilidade.","limits":"O TCC distingue características do EES, inserção no Código Civil e enquadramento em política pública; verificar o instrumento aplicável.","source":["ees","matrix","models"],"extra":{}},{"id":"fundo","title":"DAO de investimento com fundo regulado","group":"Patrimônio especial","summary":"Fundo especial: segregação sem personalidade plena, por força de lei","scenario":"Um fundo regulado, com documentos e agentes exigidos, usa votação de investidores para aconselhar a estratégia e registra cotas digitais. Os organizadores querem tratar um contrato da rede como se criasse livremente classes de patrimônios isolados.","unit":["Infraestrutura registra cotas e consultas.","Investidores com posições reguladas, não uma sociedade por só serem cotistas.","Condomínio especial organizado segundo regime de fundos.","Fundo e administradores sujeitos à legislação e regulação específicas."],"regime":"Fundo de investimento como condomínio de natureza especial, se cumpridos os requisitos do regime próprio","qualification":"Arts. 1.368-C a 1.368-F admitem combinações legais de patrimônio, classes e responsabilidade; o TCC não autoriza qualquer DAO a se declarar fundo.","alternative":"Conferir efetivo registro/publicidade dos regulamentos e disciplina CVM; token livre não é classe segregada por si.","dims":["D1 — imputação e atuação dentro das competências da estrutura regulada do fundo.","D2 — exemplo paradigmático de efeitos legais patrimoniais sem personalidade plena, nos limites do regime.","D3 — regulamento e publicidade/oponibilidade regulamentares; blockchain não substitui exigências.","D4 — decisões da comunidade não alteram automaticamente deveres dos agentes e órgãos regulados.","D5 — responsabilidade das categorias de investidores/agentes segue lei e regulamento; não generalizar proteção."],"situations":["Regime específico já disciplina determinadas classes e patrimônios.","Implementar rastreio on-chain compatível com regulação exige esforço.","Discutir incidência e compatibilidade de estruturas digitais com instrumentos regulados.","Não há lacuna criada pelo desejo de clonar segregação de classe em contrato privado.","Preferir dispensar CVM/administradores não gera esse direito."],"comparative":"T1 aparece com clareza: separação e limitação decorrem de normas; T2 registro e T3 órgãos especializados permanecem.","critical":"O exame crítico inclui a proteção dos cotistas e credores e a assimetria informacional de agentes controladores.","paths":["Aplicar integralmente o regime especial de fundos antes de qualquer tokenização.","Documentar interface digital respeitando competências e deveres próprios.","Efeitos patrimoniais novos demandariam alteração da lei/regulação dentro das competências aplicáveis."],"outcome":"O regime de fundos pode fornecer efeitos patrimoniais específicos, mas não é forma livre e indiscriminadamente disponível a qualquer DAO.","limits":"O recorte do TCC usa fundos como contraexemplo funcional, não como proposta de enquadramento automático.","source":["fundo","matrix","compar"],"extra":{}},{"id":"spe","title":"DAO criada para projeto de infraestrutura","group":"Forma derivada","summary":"SPE não é tipo que confere segregação por denominação","scenario":"Uma DAO pretende financiar construção de um ativo digital durante três anos e anuncia sua “SPE DAO” na internet. Seus promotores ainda não definiram se usarão Ltda, S.A. ou outro regime e supõem que o nome SPE isole os ativos dos fundadores.","unit":["Código organiza marcos de desembolso.","Promotores e financiadores com papéis contratuais ainda indefinidos.","Projeto econômico com finalidade e duração delimitadas.","Apenas o rótulo SPE, sem forma jurídica definida."],"regime":"Projeto de propósito específico que ainda exige escolha de tipo e constituição jurídica","qualification":"SPE delimita objeto do empreendimento, mas não cria tipo autônomo nem efeitos de personalidade, patrimônio ou responsabilidade por nomenclatura.","alternative":"Pode ser compatível com Ltda ou S.A., se respectivos requisitos e relação com investimentos forem observados.","dims":["D1 — quem contrata depende da forma/representantes ainda a constituir.","D2 — segregar patrimônio exige escolher e observar regime; dizer SPE não basta.","D3 — publicidade registral da entidade efetivamente criada.","D4 — programação de desembolsos não determina competência de administradores.","D5 — obrigações e responsabilização dependem das relações vigentes e do tipo eleito."],"situations":["Há formas existentes disponíveis para o empreendimento.","Transferir ativos e documentar objeto/controle exige atos.","A identificação de vínculos prévios pode exigir investigação.","Falta de proteção automática do nome SPE não demonstra lacuna.","Desejar proteção sem constituição não substitui procedimento."],"comparative":"T1 e T2: separação/registro dependem de tipos jurídicos escolhidos; T3: representação não é criada pelo nome SPE.","critical":"Quem efetivamente manda nos desembolsos pode diferir dos futuros órgãos; verificar assimetria.","paths":["Escolher e constituir forma efetiva compatível com o projeto.","Documentar correspondência entre marcos do protocolo, contrato e representantes.","Só justificar tipo novo se efeitos adicionais indispensáveis e vantagens demonstradas."],"outcome":"SPE é modalidade funcional de organização de empreendimento, não figura suficiente, isoladamente, para garantir personalidade e patrimônio apartado.","limits":"Não é possível atribuir regime de responsabilidade antes de identificar a forma jurídica e os vínculos.","source":["spe","ltda","sa","contract"],"extra":{}},{"id":"estrangeira","title":"DAO com wrapper estrangeiro atuando no Brasil","group":"Conexão estrangeira","summary":"Incorporação externa não equivale a atuação brasileira irrestrita","scenario":"Uma entidade estrangeira validamente constituída dirige parte de um protocolo com desenvolvedores no Brasil, contrata usuários locais e controla uma multisig; há membros globais que não aderiram ao contrato da entidade. Os promotores alegam que a inscrição externa dispensa qualquer exame brasileiro.","unit":["Protocolo e software utilizados globalmente.","Comunidade internacional maior que o universo de membros da entidade.","Prestação e controle com vínculos transnacionais e atuação brasileira a apurar.","Entidade constituída fora do País, cujo vínculo a cada relação deve ser provado."],"regime":"Reconhecimento de entidade estrangeira + qualificação da atividade e eventual funcionamento no Brasil","qualification":"LINDB art. 11 e CC arts. 1.134–1.138 condicionam a análise de reconhecimento/funcionamento; residência isolada de participantes não decide essas questões.","alternative":"Ainda é preciso avaliar contratos, serviços, representação, setor regulado e titularidade de cada ativo.","dims":["D1 — distinguir poderes da entidade e atos de operadores locais ou comunidade externa.","D2 — bens e titularidade conforme direito aplicável e vínculos; entidade estrangeira não recebe toda tesouraria automaticamente.","D3 — reconhecimento de atos e requisitos de atuação/registro no Brasil a examinar.","D4 — controle real da multisig deve ser confrontado com governança formal estrangeira.","D5 — responsabilidade segue vínculos e atos pertinentes; país de constituição não gera imunidade irrestrita."],"situations":["O ordenamento possui regras de conexão e funcionamento de sociedades estrangeiras.","Mapear local da atividade e identidade dos operadores é questão prática.","Pode haver disputa sobre quando há funcionamento no País.","O TCC não identifica lacuna geral só pela transnacionalidade.","Preferência por invólucro estrangeiro não elimina normas brasileiras incidentes."],"comparative":"T2/T3: interfaces jurídicas e formalidades locais podem subsistir mesmo com constituição estrangeira.","critical":"Analisar se a entidade formal é meramente nominal e a administração econômica ocorre por operadores brasileiros.","paths":["Reconhecer a entidade e testar regras de funcionamento e contratos no Brasil.","Documentar perímetro entidade-comunidade e poderes transfronteiriços.","Mudanças de conexão jurídica exigiriam pesquisa própria, não presumida pelo TCC."],"outcome":"Pessoa jurídica estrangeira é elemento relevante, porém insuficiente para qualificar toda a operação brasileira e comunidade.","limits":"O TCC não determina regra universal de conexão para organização digital sem Estado de constituição identificável.","source":["foreign","unit","control","regulation"],"extra":{}},{"id":"hibrida","title":"DAO com Ltda operadora e tesouraria comunitária","group":"Misto","summary":"Segundo exemplo analítico da seção 4.5.3","scenario":"Protocolo administra tesouraria sob chaves de três mantenedores; participantes entram e saem livremente. Uma Ltda unipessoal foi constituída somente para contratar serviços de suporte. Não há documento que transfira à Ltda a tesouraria ou vincule a comunidade inteira.","unit":["Protocolo financeiro mantém regras e carteira de tesouraria.","Participação variável e controle dividido entre votos e chaves.","Existe coordenação de recursos e poder técnico, mas seu perímetro jurídico precisa ser reconstruído.","Ltda representa apenas operações comprovadamente assumidas; não toda a comunidade."],"regime":"Arranjo híbrido de perímetros parciais: Ltda operadora + comunidade e protocolo a qualificar separadamente","qualification":"A existência de Ltda não incorpora automaticamente todo o patrimônio e a governança à entidade; é necessária prova de atos, bens e competências.","alternative":"A comunidade pode conter vínculos contratuais e, em determinadas condições, relações societárias não personificadas; nenhuma é presumida por possuir tokens.","dims":["D1 — representantes da Ltda vinculam apenas atos de sua competência; demais atos exigem identificação própria.","D2 — tesouraria on-chain não vira capital da Ltda sem conferência jurídica; separar patrimônios é questão central.","D3 — documentação societária informa parte do arranjo; token/ledger não substitui publicidade de atos relevantes.","D4 — três mantenedores controlam poderes de emergência; comparar poderes formais e materiais.","D5 — obrigações da Ltda, dos demais vínculos e por conduta própria demandam individuação; não há imunidade geral."],"situations":["O direito já disciplina a Ltda e contratos efetivamente demonstrados.","Demonstrar perímetro, bens e identidade dos controladores da multisig é dificuldade probatória.","Qualificação do remanescente da comunidade pode ser controvertida.","Podem persistir funções patrimoniais não atendidas pelo desenho desejado, sem que se tenha provado lacuna geral.","O desejo de ausência de qualquer representante jurídico não implica direito a ela."],"comparative":"T1: ativos no protocolo não se segregam a favor da Ltda por código. T2: documento pode ampliar informação. T3: controle técnico e interface da entidade persistem.","critical":"Risco alto de dissociação entre o representante formal da Ltda e os controladores reais da tesouraria; identificar a quem cabem deveres em cada relação.","paths":["Aplicar o regime da Ltda ao seu perímetro e investigar vínculos externos do protocolo.","Interface documental facultativa poderia identificar código, chaves, contratos e responsabilidades, quando admitida.","Um regime facultativo mais protetivo poderia ser pesquisado, mas necessidade e superioridade não foram demonstradas."],"outcome":"Não existe uma única qualificação jurídica automática para toda a DAO; a Ltda cobre parte da atividade e a tesouraria/comunidade exigem análise própria.","limits":"Não concluir que toda comunidade é sócia da Ltda ou que todos os ativos se tornaram sociais; tampouco que há vazio jurídico.","source":["unit","ltda","models","interface"],"extra":{"inTCC":"Adaptação do segundo exemplo analítico de § 4.5.3, p. 85"}},{"id":"crise","title":"DAO de consumo com perdas e pseudônimos","group":"Tutela","summary":"Tutela judicial não desaparece por ausência de personalidade","scenario":"Uma DAO vende licenças de software ao público por site e recebe em criptoativos. Uma atualização defeituosa interrompe o acesso. Consumidores conhecem endereços on-chain, mas não identificam todos os integrantes nem a entidade fornecedora; dois operadores publicaram e assinaram a atualização.","unit":["Aplicação de licenças e execução automática.","Clientes são usuários, não necessariamente sócios.","Há operação de oferta e fornecimento econômico a investigar.","Nenhuma entidade foi demonstrada, mas a ausência não exclui pretensões jurídicas."],"regime":"Qualificar a relação contratual/de consumo, eventuais sociedades e condutas próprias; não concluir pela falta de tutela","qualification":"CPC art. 75, IX admite representação de entes organizados sem personalidade; art. 319, §§1º–3º admite diligências; CC arts. 186/187/927 e CDC quando incidente.","alternative":"Não responsabilizar automaticamente qualquer detentor de token: individualizar função, conduta, culpa ou outros fundamentos pertinentes.","dims":["D1 — investigar quem ofereceu licenças e representou a atividade, sem exigir pessoa jurídica prévia como única hipótese.","D2 — localizar ativos, detentores e patrimônio pertinente; a carteira não identifica sozinha o titular civil.","D3 — rastros on-chain servem como informação/prova, não certidão de identidade.","D4 — operadores que assinaram atualização têm poder técnico; isso não define sozinho cargo nem culpa.","D5 — examinar pretensão contratual/consumerista e condutas próprias, com devido processo e meios de execução."],"situations":["Existem instrumentos de tutela e representação processual.","Pseudonímia e acesso a prova dificultam a implementação de providências.","Reconstrução do vínculo/fornecedor pode ser controvertida.","A dificuldade em descobrir réus não basta para alegar inexistência normativa de tutela.","Recusa dos promotores em identificar-se não gera imunidade jurídica."],"comparative":"T3: a persistência de interfaces identificáveis importa à responsabilização; T1 não atribui patrimônio por visibilidade on-chain.","critical":"Avaliar quem realmente tinha poder de atualizar e quem suportou riscos da decisão, sem imputar culpa por simples signatário.","paths":["Aplicar regime material e processo segundo vínculos, provas e condutas.","Documentar versionamento e responsável por alterações, preservando dados pessoais.","Dificuldade de prova pode justificar mecanismos informacionais, não necessariamente nova pessoa jurídica."],"outcome":"O caso demonstra obstáculo de prova/execução e necessidade de análise de tutela; não autoriza declarar que a DAO é inimputável.","limits":"A pesquisa não fornece regime brasileiro universal de responsabilidade dos desenvolvedores nem elimina exigências do contraditório.","source":["liab","tech","control","summary"],"extra":{}}],"sections":[["premissas","01","Premissas epistemológicas"],["unidade","02","Unidade de qualificação"],["qualificar","03","Exegese das categorias"],["dimensoes","04","D1–D5 · tertium"],["situacoes","05","Cinco situações"],["comparar","06","Comparação e transplante"],["avaliar","07","Poder, risco e modelos"],["vias","08","Três planos e hipóteses"],["concluir","09","Output jurídico"]],"categories":[["infra","Protocolo-infraestrutura; sem organização demonstrada","unit"],["atip","Contrato atípico; art. 425","contract"],["comum","Sociedade em comum; arts. 986–990","common"],["scp","Sociedade em conta de participação (SCP)","scp"],["ltda","Sociedade limitada empresária","ltda"],["ltda-simples","Sociedade limitada simples; natureza da atividade","contract"],["sa","Sociedade anônima (S.A.)","sa"],["coop","Cooperativa","coop"],["assoc","Associação","assoc"],["fund","Fundação","fund"],["ees","Empreendimento de economia solidária","ees"],["fundo","Fundo de investimento / condomínio especial","fundo"],["spe","Sociedade de propósito específico (SPE)","spe"],["estrangeira","Entidade estrangeira e funcionamento no Brasil","foreign"],["hibrida","Wrapper parcial / arranjo híbrido descritivo","unit"],["crise","Tutela e responsabilidade em DAO pseudônima","liab"]],"scope":"O modelo é analítico-dogmático. O software não presta aconselhamento jurídico nem identifica automaticamente fatos não demonstrados. Os casos são hipóteses novas ou adaptações declaradas dos dois exemplos da § 4.5.3; as fontes apontam para as regras aplicadas, não para a ocorrência dos fatos.","norms":[{"id":"cc104","title":"Validade e forma dos negócios","act":"Código Civil, arts. 104, 107, 113, 166, 182 e 422","how":"Testar capacidade, objeto, forma, interpretação, invalidade e efeitos de transações executadas digitalmente.","limit":"Execução irreversível em blockchain não prova validade, consentimento ou transferência juridicamente eficaz.","pin":"§ 4.3, p. 67, 1º par.; nota 80, p. 67","cases":["infra","atip","comum","scp","ltda","ltda-simples","sa","coop","assoc","fund","ees","fundo","spe","estrangeira","hibrida","crise"],"stages":["premissas","qualificar","dimensoes","situacoes","vias"],"dims":["D1","D3"]},{"id":"cc425","title":"Autonomia privada e contratos atípicos","act":"Código Civil, arts. 421–425, especialmente art. 425","how":"Admite pactos para organizar contribuições, remuneração, delegações e decisões internas.","limit":"Cláusula privada entre participantes não cria imunidade perante credores alheios nem substitui qualificação societária.","pin":"§ 4.2.1, p. 59, 1º–2º par.; notas 65–66, p. 59","cases":["atip","comum","scp","ltda","hibrida","infra","crise"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D1","D5"]},{"id":"cc981","title":"Pressupostos da sociedade","act":"Código Civil, arts. 981–983","how":"Verificar contribuições recíprocas, atividade econômica comum e partilha de resultados; não deduzir sociedade da posse de tokens.","limit":"A participação em votação, isoladamente, não demonstra sócio ou responsabilidade pessoal.","pin":"§ 4.2.1, pp. 59–60; notas 65 e 67","cases":["infra","atip","comum","scp","ltda","ltda-simples","coop","ees","hibrida","spe","crise"],"stages":["premissas","unidade","qualificar","dimensoes","situacoes"],"dims":["D1","D4","D5"]},{"id":"cc966","title":"Empresarialidade e exceção intelectual","act":"Código Civil, art. 966, e art. 1.150","how":"Distingue atividade econômica comum de empresa; profissão intelectual pode não caracterizar empresa sem elemento de empresa.","limit":"O uso de blockchain ou da forma Ltda não prova automaticamente empresarialidade.","pin":"§ 4.2.1, p. 60, 3º par.; nota 67, p. 60","cases":["comum","ltda","ltda-simples","coop","ees","spe","estrangeira","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D3"]},{"id":"cc-person","title":"Personalidade e registro","act":"Código Civil, arts. 45, 985, 967 e 1.150–1.154","how":"Fundamenta aquisição da personalidade segundo tipo e inscrição exigível e os efeitos registrários.","limit":"Não elimina a disciplina de entes não personificados nem autoriza substituir automaticamente o registro pela blockchain.","pin":"§ 4.3.2, p. 69, 1º par.; nota 83; § 4.5.5, p. 89, 2º par. e nota 110","cases":["comum","ltda","ltda-simples","sa","coop","assoc","fund","ees","spe","hibrida","estrangeira","crise"],"stages":["qualificar","dimensoes","comparar","situacoes","vias"],"dims":["D2","D3"]},{"id":"cc-common","title":"Sociedade em comum: disciplina geral","act":"Código Civil, arts. 986–990","how":"Incidência para sociedade com atos constitutivos não inscritos, salvo ressalvas; reconhece patrimônio especial e regime de responsabilidade.","limit":"Não confere personalidade ou blindagem geral de sócios; exige prova de quem integra efetivamente a sociedade.","pin":"§ 4.2.2, pp. 60–61, 1º–3º par.; nota 68, p. 61; Quadro 2, p. 67","cases":["comum","atip","infra","hibrida","crise","ees"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D2","D3","D5"]},{"id":"cc987","title":"Prova da sociedade em comum","act":"Código Civil, art. 987","how":"Distingue prova por escrito exigida dos sócios e prova por qualquer meio permitida aos terceiros.","limit":"Registro de carteiras/votos é potencial prova, mas não comprova automaticamente identidade ou vínculo societário.","pin":"§ 4.2.2, p. 61, 2º par.; nota 68; Quadro 4, p. 92, linha D1","cases":["comum","atip","hibrida","crise"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D3","D5"]},{"id":"cc988-990","title":"Patrimônio especial e responsabilidade de sócios","act":"Código Civil, arts. 988–990, e arts. 1.024–1.026","how":"Distingue patrimônio de titularidade comum, atos de gestão, responsabilidade solidária/ilimitada e benefício de ordem.","limit":"Patrimônio especial não significa responsabilidade limitada; art. 990 retira benefício de ordem do sócio contratante pela sociedade.","pin":"§ 4.2.2, pp. 60–61; nota 68, p. 61; § 4.5.1, p. 81","cases":["comum","atip","hibrida","crise","ees"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D2","D5"]},{"id":"cc1026","title":"Credor pessoal e quota de liquidação","act":"Código Civil, art. 1.026, combinado com art. 986","how":"Discute alcance da quota/lucros para credor particular e a relação com patrimônio especial da sociedade em comum.","limit":"A extensão à sociedade em comum exige fundamentar compatibilidade; posição doutrinária não é efeito geral automático.","pin":"§ 4.2.2, p. 61, 2º par.; notas 68–69","cases":["comum","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D5"]},{"id":"cc-scp","title":"Sociedade em conta de participação","act":"Código Civil, arts. 991–996, especialmente 993, parágrafo único, e 994, §§ 1º–2º","how":"Ostensivo atua em nome próprio e sob responsabilidade própria; participante mantém relação interna; intervenção externa pode gerar solidariedade delimitada.","limit":"Patrimônio especial da conta tem efeitos entre sócios, sem personalidade nem blindagem geral perante credores do ostensivo.","pin":"§ 4.2.2, p. 62, parágrafo da SCP; nota 70; Quadro 2, p. 67","cases":["scp","atip","hibrida"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D2","D4","D5"]},{"id":"cc-ltda","title":"Limitada: personalidade, capital e administração","act":"Código Civil, arts. 985, 1.052–1.053 e 1.060–1.062","how":"Oferece estrutura personificada, responsabilidade ligada ao capital e administração por pessoas designadas.","limit":"A Ltda não engloba automaticamente tesouraria ou comunidade associada ao protocolo.","pin":"§ 4.2.3, p. 62, 1º par.; nota 71; § 4.1.1, p. 57, 1º par.","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D2","D4","D5"]},{"id":"cc1055","title":"Capital social e bens em criptoativos","act":"Código Civil, arts. 997, III–IV, 1.052 e 1.055, §§ 1º–2º","how":"Conferência e estimação de bens para integralização na limitada, com responsabilidade pela estimação e vedação de serviços como integralização.","limit":"Carteira comunitária não se transforma em capital social por votação sem ato jurídico e titularidade demonstrada.","pin":"§ 4.2.3, p. 63, 1º par.; nota 72","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","comparar","situacoes"],"dims":["D2","D3"]},{"id":"drei4081","title":"Integralização com criptomoedas: orientação","act":"DREI, Ofício Circular SEI nº 4081/2020/ME","how":"Reconhece possibilidade de integralização com criptomoedas, observadas as formalidades e restrições próprias.","limit":"A orientação não certifica segurança do ativo nem reconhece uma DAO como pessoa jurídica.","pin":"§ 4.2.3, p. 63, 1º par.; nota 72","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","vias"],"dims":["D2","D3"]},{"id":"cc1057","title":"Cessão de quotas e transmissão por token","act":"Código Civil, art. 1.057","how":"A cessão de quotas da limitada tem requisitos e efeitos próprios a observar.","limit":"Transferência técnica de token não transfere automaticamente quota ou altera contrato social.","pin":"§ 4.2.3, p. 63, 2º par.; nota 73, p. 64","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D1","D3"]},{"id":"cc-exit","title":"Retirada, haveres e responsabilidades","act":"Código Civil, arts. 1.003, parágrafo único, 1.029, 1.031–1.032, 1.053 e 1.077","how":"Diferencia venda de token, recesso, retirada, apuração de haveres e obrigações anteriores.","limit":"Venda em exchange não é, automaticamente, resolução do vínculo societário.","pin":"§ 4.2.3, pp. 63–64, 4º–5º par.; nota 73, p. 64","cases":["ltda","ltda-simples","sa","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D4","D5"]},{"id":"cc-delib","title":"Assembleia e votação de limitada","act":"Código Civil, arts. 48-A, 1.071–1.076 e 1.080-A","how":"Prevê deliberações, quóruns, reuniões digitais e requisitos de manifestação e votação.","limit":"Código que conta votos não garante sozinho convocação, legitimidade, quórum, representação e documentação exigidos.","pin":"§ 4.3.1, pp. 68–69; nota 82, p. 69","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D3","D4"]},{"id":"cc-contas","title":"Contas e direitos de fiscalização","act":"Código Civil, arts. 1.020–1.021, 1.053 e 1.078","how":"Regula prestação de contas, livros, documentos e mecanismos de fiscalização na sociedade, conforme regência aplicável.","limit":"Transparência do ledger não substitui prestação de contas juridicamente exigida.","pin":"§ 4.4.1, p. 73, 2º par.; nota 87","cases":["ltda","ltda-simples","hibrida","comum"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D3","D4"]},{"id":"cc-conflict","title":"Conflito de interesses e voto","act":"Código Civil, arts. 1.010, § 3º, e 1.074, § 2º","how":"Fornece limites ao voto em situação de conflito e responsabilidade por aprovação de operação danosa nos pressupostos legais.","limit":"Uma compra de votos no mercado ou execução automática não elimina o exame de conflito material e requisitos de incidência.","pin":"§ 4.4.1, p. 73, 3º par.; nota 88; Quadro 4, p. 92, linha D4","cases":["ltda","ltda-simples","hibrida","comum","spe"],"stages":["qualificar","dimensoes","avaliar","vias"],"dims":["D4","D5"]},{"id":"cc1080","title":"Deliberação contrária a lei/contrato","act":"Código Civil, art. 1.080","how":"Responsabilidade nas hipóteses de deliberação expressamente aprovada em violação da lei ou do contrato.","limit":"Não se presume responsabilidade de qualquer detentor de token: é necessária incidência dos pressupostos da regra.","pin":"§ 4.4.2, p. 75, 1º par.; nota 91, p. 75","cases":["ltda","ltda-simples","hibrida","spe"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D4","D5"]},{"id":"sa-capital","title":"Conferência de bens e ações","act":"Lei nº 6.404/1976, arts. 7º–8º, 31 e 34–35","how":"Disciplina avaliação de bens e titularidade/circulação de ações nominativas e escriturais.","limit":"O token, por si, não gera ou transmite título acionário fora dos requisitos legais.","pin":"§ 4.2.3, pp. 63–64; notas 72 e 74","cases":["sa"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D2","D3"]},{"id":"sa-org","title":"Órgãos e competências da S.A.","act":"Lei nº 6.404/1976, arts. 138–139, 144 e 146","how":"Distribui poderes de administração/representação e restringe delegação das atribuições legais dos órgãos.","limit":"Votação aberta em smart contract não substitui conselho/diretoria nem outorga competência a código por si.","pin":"§ 4.2.3, p. 64, 2º–3º par.; nota 74","cases":["sa"],"stages":["qualificar","dimensoes","situacoes","vias"],"dims":["D1","D4"]},{"id":"sa-controle","title":"Acionista controlador, abuso e deveres","act":"Lei nº 6.404/1976, arts. 115–117 e 153–158","how":"Confronta controle efetivo, voto, conflitos de interesses e deveres de gestão.","limit":"Concentração de tokens/chaves não demonstra automaticamente o controle jurídico definido no art. 116.","pin":"§ 4.4.1, pp. 73–74, 3º–5º par.; notas 88–90; Quadro 4, p. 92, linha D4","cases":["sa","hibrida"],"stages":["qualificar","dimensoes","avaliar"],"dims":["D4","D5"]},{"id":"sa-fiscal","title":"Direitos de fiscalização da S.A.","act":"Lei nº 6.404/1976, arts. 105, 109, III, e 133–134","how":"Preserva acesso a informações, fiscalização e documentação nas condições legais.","limit":"Histórico on-chain não necessariamente contém os elementos de prestação de contas protegidos.","pin":"§ 4.4.1, p. 73, 2º par.; nota 87","cases":["sa"],"stages":["qualificar","dimensoes","avaliar"],"dims":["D3","D4"]},{"id":"sa-recesso","title":"Recesso e anulação societária na S.A.","act":"Lei nº 6.404/1976, arts. 45, 136–137 e 286","how":"Apuração de reembolso e hipóteses de retirada/impugnação deliberativa.","limit":"Negociação do token não equivale automaticamente a retirada; prazos não são intercambiáveis com prazos do Código Civil.","pin":"§ 4.2.3, p. 64, 1º par.; nota 73; § 4.4.2, p. 75, nota 92","cases":["sa"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D3","D4","D5"]},{"id":"sa159","title":"Responsabilização e ação social na S.A.","act":"Lei nº 6.404/1976, arts. 159 e 246","how":"Disciplina ações de responsabilidade por prejuízo social e, nas hipóteses legais, responsabilidade de controlador.","limit":"Não se confunde dano da sociedade com prejuízo direto de acionista/terceiro; observar legitimação específica.","pin":"§ 4.4.2, pp. 75–76; nota 93, p. 76","cases":["sa"],"stages":["qualificar","dimensoes","situacoes"],"dims":["D5"]},{"id":"coop5764","title":"Cooperativa e voto pessoal","act":"Lei nº 5.764/1971, arts. 3º–4º, 11–13, 21, 38 e 42; Código Civil, arts. 1.093–1.096","how":"Regras de associação, singularidade de voto com ressalvas e intransferibilidade de quotas a estranhos.","limit":"Não autoriza multiplicar voto pelo token ou negociar livremente a posição pessoal do cooperado.","pin":"§ 4.2.4, pp. 64–65; nota 75, p. 65","cases":["coop"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D1","D2","D3","D4","D5"]},{"id":"assoc53","title":"Associação: finalidade, estatuto e membros","act":"Código Civil, arts. 45, 48-A e 53–61","how":"Organização de fins não econômicos; estatuto, órgãos, associados e possibilidades de assembleia eletrônica.","limit":"Receita instrumental não é partilha societária de lucros; não apagar direitos de associado por mecanismo técnico.","pin":"§ 4.2.4, p. 65, parágrafo das associações; nota 76","cases":["assoc"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D1","D2","D4"]},{"id":"assoc57","title":"Exclusão e defesa de associado","act":"Código Civil, art. 57; art. 59 e garantias estatutárias","how":"Exclusão de associado requer justa causa e procedimento com defesa e recurso; deliberações respeitam competência.","limit":"Remoção automática de acesso ou token não elimina proteção contra exclusão arbitrária.","pin":"§ 4.2.4, p. 65, parágrafo das associações; nota 76","cases":["assoc"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D3","D4","D5"]},{"id":"fund62","title":"Fundação: finalidade, afetação e fiscalização","act":"Código Civil, arts. 62–69, especialmente arts. 62 e 66","how":"Dotação de bens a finalidade permitida e fiscalização do Ministério Público.","limit":"Não serve como sociedade de tokenholders que pretendam repartir o acervo fundacional.","pin":"§ 4.2.4, p. 65, parágrafo das fundações; nota 76","cases":["fund"],"stages":["qualificar","dimensoes","situacoes","avaliar"],"dims":["D1","D2","D4","D5"]},{"id":"ees15068","title":"Empreendimento de economia solidária
